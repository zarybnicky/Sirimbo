name: deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sirimbo-main
  cancel-in-progress: false

env:
  DATA_IMAGE: 127.0.0.1:5000/rozpisovnik/worker-data:20261120
  NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN || 'https://943ee3e7e7044524b2ee8413a957e14f@o775093.ingest.sentry.io/5796825' }}
  NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${{ vars.NEXT_PUBLIC_SENTRY_ENVIRONMENT || 'production' }}

jobs:
  deploy:
    runs-on:
      - self-hosted
      - deploy
      - sirimbo
    steps:
      - uses: actions/checkout@v7

      - name: Push image to local registry
        run: |
          set -euo pipefail

          echo "::add-mask::${SENTRY_AUTH_TOKEN}"
          echo "SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN}" >> "$GITHUB_ENV"

          docker buildx use default
          docker buildx inspect --bootstrap

          docker buildx build \
            --file deploy/Dockerfile \
            --target runner \
            --allow network.host \
            --no-cache-filter graphql-validation \
            --no-cache="${{ github.event_name == 'workflow_dispatch' }}" \
            --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_SENTRY_DSN="${NEXT_PUBLIC_SENTRY_DSN}" \
            --build-arg NEXT_PUBLIC_SENTRY_ENVIRONMENT="${NEXT_PUBLIC_SENTRY_ENVIRONMENT}" \
            --build-arg SENTRY_AUTH_TOKEN="${SENTRY_AUTH_TOKEN}" \
            --secret id=GITHUB_SHA,env=GITHUB_SHA \
            --tag "127.0.0.1:5000/sirimbo:${GITHUB_SHA}" \
            --push \
            .

      - name: Ensure worker data image exists
        run: |
          if ! docker manifest inspect --insecure "$DATA_IMAGE" >/dev/null; then
            docker buildx build --file deploy/worker-data.Dockerfile \
              --platform linux/amd64 --tag "$DATA_IMAGE" --push .
          fi

      - name: Push worker image
        run: |
          set -euo pipefail
          docker buildx build \
            --file deploy/worker.Dockerfile \
            --build-arg "DATA_IMAGE=$DATA_IMAGE" \
            --no-cache="${{ github.event_name == 'workflow_dispatch' }}" \
            --platform linux/amd64 \
            --tag "127.0.0.1:5000/rozpisovnik/worker:${GITHUB_SHA}" \
            --push \
            .

      - name: Deploy exact Git SHA with Argo
        run: |
          set -euo pipefail
          argocd --core app sync sirimbo --timeout 600 --revision "${GITHUB_SHA}" --prune
          argocd --core app wait sirimbo --timeout 600 --sync --health
