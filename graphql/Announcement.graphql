fragment AnnouncementAudience on AnnouncementAudience {
  id
  audienceRole
  cohortId
  cohort {
    ...CohortBasic
  }
}

fragment Announcement on Announcement {
  __typename
  id
  title
  body
  createdAt
  updatedAt
  scheduledSince
  scheduledUntil
  status
  isSticky
  authorId
  authorName
  announcementAudiences {
    nodes {
      ...AnnouncementAudience
    }
  }
  explicitAttachments: attachments(condition: {inline: false}) {
    nodes {
      file {
        ...File
      }
    }
  }
}

query Announcements(
  $condition: AnnouncementCondition
  $first: Int
  $offset: Int
  $cursor: Cursor
  $orderBy: [AnnouncementsOrderBy!] = [CREATED_AT_DESC]
) {
  announcements(
    condition: $condition
    first: $first
    offset: $offset
    after: $cursor
    orderBy: $orderBy
  ) {
    totalCount
    nodes {
      ...Announcement
    }
    pageInfo {
      __typename
      hasNextPage
      endCursor
    }
  }
}

mutation UpdateAnnouncement($id: BigInt!, $patch: AnnouncementPatch!) {
  updateAnnouncement(input: {id: $id, patch: $patch}) {
    announcement {
      ...Announcement
    }
  }
}

query Announcement($id: BigInt!) {
  announcement(id: $id) {
    ...Announcement
  }
}

mutation UpsertAnnouncement($input: UpsertAnnouncementInput!) {
  upsertAnnouncement(input: $input) {
    result {
      ...Announcement
    }
  }
}

mutation DeleteAnnouncement($id: BigInt!) {
  deleteAnnouncement(input: {id: $id}) {
    __typename
  }
}
