fragment AnnouncementAudience on AnnouncementAudience {
  id
  audienceRole
  cohortId
  cohort {
    ...CohortBasic
  }
}

fragment Announcement on Announcement {
  __typename
  id
  title
  body
  createdAt
  updatedAt
  scheduledSince
  scheduledUntil
  status
  isSticky
  author {
    id
    uJmeno
    uPrijmeni
  }
  announcementAudiences {
    nodes {
      ...AnnouncementAudience
    }
  }
}

query StickyAnnouncements($orderBy: AnnouncementsOrderBy = UPDATED_AT_DESC) {
  stickyAnnouncements: announcements(
    condition: {isSticky: true, status: PUBLISHED}
    orderBy: [$orderBy, CREATED_AT_DESC]
  ) {
    totalCount
    nodes {
      ...Announcement
    }
  }
}

query MyAnnouncements(
  $status: AnnouncementStatus = PUBLISHED
  $first: Int
  $offset: Int
  $orderBy: AnnouncementsOrderBy = UPDATED_AT_DESC
) {
  myAnnouncements: announcements(
    condition: {isSticky: false, status: $status}
    first: $first
    offset: $offset
    orderBy: [$orderBy, CREATED_AT_DESC]
  ) {
    totalCount
    nodes {
      ...Announcement
    }
  }
}

query AnnouncementList($first: Int, $cursor: Cursor, $orderBy: AnnouncementsOrderBy = CREATED_AT_DESC) {
  announcements(
    first: $first,
    after: $cursor,
    orderBy: [$orderBy],
  ) {
    totalCount
    nodes {
      ...Announcement
    }
    pageInfo {
      __typename
      hasNextPage
      endCursor
    }
  }
}

mutation SetAnnouncementStatus($id: BigInt!, $status: AnnouncementStatus!) {
  updateAnnouncement(input: {id: $id, patch: {status: $status}}) {
    announcement {
      ...Announcement
    }
  }
}

mutation ToggleAnnouncementSticky($id: BigInt!, $sticky: Boolean!) {
  updateAnnouncement(input: {id: $id, patch: {isSticky: $sticky}}) {
    announcement {
      ...Announcement
    }
  }
}

query Announcement($id: BigInt!) {
  announcement(id: $id) {
    ...Announcement
  }
}

mutation UpsertAnnouncement($input: UpsertAnnouncementInput!) {
  upsertAnnouncement(input: $input) {
    announcement {
      ...Announcement
    }
  }
}

mutation DeleteAnnouncement($id: BigInt!) {
  deleteAnnouncement(input: {id: $id}) {
    __typename
  }
}
