fragment ArticleSummary on Aktuality {
  __typename
  id
  atPreview
  atKdo
  atJmeno
  createdAt
  updatedAt
  publishedAt
  titlePhotoUrl
  isVisible
}

fragment Article on Aktuality {
  ...ArticleSummary
  atText
  explicitAttachments: attachments(condition: {inline: false}) {
    nodes {
      file {
        ...File
      }
    }
  }
}

query Article($id: BigInt!) {
  aktuality(id: $id) {
    ...Article
  }
}

query Articles($first: Int, $offset: Int, $visibleOnly: Boolean) {
  aktualities(first: $first, offset: $offset, orderBy: [PUBLISHED_AT_DESC, ID_DESC], condition:  {
     isVisible: $visibleOnly
  }) {
    totalCount
    nodes {
      ...ArticleSummary
    }
  }
}

mutation UpsertArticle($input: UpsertArticleInput!) {
  upsertArticle(input: $input) {
    result {
      ...Article
    }
  }
}

mutation DeleteArticle($id: BigInt!) {
  deleteAktuality(input: {id: $id}) {
    __typename
  }
}
