fragment AccessCredential on AccessCredential {
  id
  kind
  label
  code
  since
  until
  isAllowed
  lastUsed
  person {
    id
    name
  }
}

fragment AccessEvent on AccessEvent {
  id
  kind
  code
  device
  occurredAt
  allowed
  reason
  location {
    id
    name
  }
  person {
    id
    name
  }
}

mutation CreateAccessCredential($input: CreateAccessCredentialInput!) {
  createAccessCredential(input: $input) {
    accessCredential {
      ...AccessCredential
    }
  }
}

mutation UpdateAccessCredential($id: BigInt!, $patch: AccessCredentialPatch!) {
  updateAccessCredential(input: { id: $id, patch: $patch }) {
    accessCredential {
      ...AccessCredential
    }
  }
}

query PeopleAccessOverview($includeCredentials: Boolean!, $membership: PersonMembershipCondition = { state: CURRENT }) {
  users @_required {
    nodes {
      id
      uEmail
    }
  }
  people(condition: { membership: $membership }) @_required {
    nodes {
      ...PersonBasic
      email
      userProxiesList {
        ...UserProxy
      }
      personInvitationsList(condition: { usedAt: null }) {
        id
        accessToken
      }
    }
  }
  accessCredentialsList(orderBy: CREATED_AT_DESC) @include(if: $includeCredentials) @_required {
    ...AccessCredential
  }
}

query AccessEventOverview($condition: AccessEventCondition, $first: Int = 100) {
  accessCredentialsList(orderBy: CREATED_AT_DESC) @_required {
    ...AccessCredential
  }
  accessEventsList(condition: $condition, orderBy: OCCURRED_AT_DESC, first: $first) @_required {
    ...AccessEvent
  }
}
