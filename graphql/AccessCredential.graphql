fragment AccessCredential on AccessCredential {
  id
  uid
  label
  since
  until
  isAllowed
}

mutation CreateAccessCredential($input: CreateAccessCredentialInput!) {
  createAccessCredential(input: $input) {
    accessCredential {
      ...AccessCredential
    }
  }
}

mutation EndAccessCredential($id: BigInt!, $until: Datetime!) {
  updateAccessCredential(input: { id: $id, patch: { until: $until } }) {
    accessCredential {
      ...AccessCredential
    }
  }
}
