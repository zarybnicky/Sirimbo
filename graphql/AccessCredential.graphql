fragment AccessCredential on AccessCredential {
  id
  kind
  label
  code
  since
  until
  isAllowed
  lastUsed
  person {
    id
    name
  }
}

fragment AccessEvent on AccessEvent {
  id
  kind
  code
  device
  occurredAt
  allowed
  reason
  person {
    id
    name
  }
}

query AccessCredentialPeople {
  people(condition: { membership: {} }, orderBy: [LAST_NAME_ASC, FIRST_NAME_ASC]) {
    nodes {
      id
      name
    }
  }
}

mutation CreateAccessCredential($input: CreateAccessCredentialInput!) {
  createAccessCredential(input: $input) {
    accessCredential {
      ...AccessCredential
    }
  }
}

mutation EndAccessCredential($id: BigInt!, $until: Datetime!) {
  updateAccessCredential(input: { id: $id, patch: { until: $until } }) {
    accessCredential {
      ...AccessCredential
    }
  }
}

mutation UpdateAccessCredential($id: BigInt!, $patch: AccessCredentialPatch!) {
  updateAccessCredential(input: { id: $id, patch: $patch }) {
    accessCredential {
      ...AccessCredential
    }
  }
}

query PeopleAccessOverview($includeCredentials: Boolean!) {
  users {
    nodes {
      id
      uEmail
    }
  }
  people(condition: { membership: {} }) {
    nodes {
      ...PersonBasic
      userProxiesList {
        ...UserProxy
      }
      personInvitationsList(condition: { usedAt: null }) {
        id
        accessToken
      }
    }
  }
  accessCredentialsList(orderBy: CREATED_AT_DESC) @include(if: $includeCredentials) {
    ...AccessCredential
  }
}

query AccessEventOverview {
  accessCredentialsList(orderBy: CREATED_AT_DESC) {
    ...AccessCredential
  }
  accessEventsList(orderBy: OCCURRED_AT_DESC, first: 100) {
    ...AccessEvent
  }
}
