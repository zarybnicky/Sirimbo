query AgeGroupRules {
  ageGroupsList(condition: { isCouple: true }) {
    code
    name
    coupleRules(condition: { division: "General" }) {
      ageGroupCode
      olderAge {
        start { value }
        end { value }
      }
      youngerAge {
        start { value }
        end { value }
      }
    }
  }
}
