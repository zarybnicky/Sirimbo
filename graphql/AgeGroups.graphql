fragment AgeGroupDetail on AgeGroup {
  code
  name
  age {
    start {
      value
    }
    end {
      value
    }
  }
  coupleRules(condition: { division: "General" }) {
    ageGroupCode
    olderAge {
      start { value }
      end { value }
    }
    youngerAge {
      start { value }
      end { value }
    }
  }
}

query AgeGroupRules {
  ageGroupsList(condition: { isCouple: true }) {
    ...AgeGroupDetail
  }
}
