fragment OutlineNode on DocumentNode {
  __typename
  id
  parentId
  ordering
  content
}

# A tag marks the node it sits on together with everything under it, so a mention
# carries that subtree and the trail of where it sits.
fragment DocumentMention on DocumentNodeTag {
  __typename
  id
  cohortId
  eventInstanceId
  eventSeriesId
  node {
    ...OutlineNode
    ancestorsList {
      ...OutlineNode
    }
    subtreeList {
      ...OutlineNode
    }
  }
}

query TenantOutline {
  tenantDocument {
    id
    title
    version
  }
}

query Outline($root: UUID) {
  documentSubtreeList(root: $root) {
    ...OutlineNode
  }
}

query OutlineBreadcrumb($node: UUID!) {
  documentNodePathList(node: $node) {
    ...OutlineNode
  }
}

query TagDances {
  dancesList(orderBy: [NAME_ASC]) {
    code
    name
    discipline
  }
}

mutation SaveOutline($input: SaveOutlineInput!) {
  saveOutline(input: $input) {
    document {
      id
      version
    }
  }
}

# The tags come back so the cache knows whose mention list just grew.
mutation AddOutlineNode($input: AddOutlineNodeInput!) {
  addOutlineNode(input: $input) {
    documentNode {
      ...OutlineNode
      tagsList {
        __typename
        id
        cohortId
        eventInstanceId
        eventSeriesId
      }
    }
  }
}
