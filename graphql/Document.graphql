fragment OutlineNode on DocumentNode {
  __typename
  id
  parentId
  ordering
  content
}

# A tag marks the node it sits on together with everything under it, so a mention
# carries that subtree and the trail of where it sits.
fragment DocumentMention on DocumentNodeTag {
  __typename
  id
  cohortId
  eventInstanceId
  eventSeriesId
  node {
    ...OutlineNode
    ancestorsList {
      ...OutlineNode
    }
    subtreeList {
      ...OutlineNode
    }
  }
}

query TenantOutline {
  tenantDocument {
    id
    title
    version
  }
}

query Outline($root: UUID) {
  documentSubtreeList(root: $root) {
    ...OutlineNode
  }
}

query OutlineBreadcrumb($node: UUID!) {
  documentNodePathList(node: $node) {
    ...OutlineNode
  }
}

# Enough of an instance for formatEventCandidate: out of context it is named by
# when it happens and who is in it.
fragment TagEventCandidate on EventInstance {
  __typename
  id
  name
  type
  since
  locationText
  location {
    id
    name
  }
  trainersList {
    id
    person {
      id
      name
    }
  }
  targetCohortsList {
    id
    cohort {
      id
      name
    }
  }
  registrationsList: eventInstanceRegistrationsByInstanceIdList(
    condition: { registrationStatus: ACTIVE }
  ) {
    id
    person {
      id
      name
    }
    couple {
      id
      man {
        id
        name
        lastName
      }
      woman {
        id
        name
        lastName
      }
    }
  }
}

# Too many events to load up front, so these two are searched as the menu is
# typed into; the rest of the tag kinds are small enough to rank in the browser.
query TagEventCandidates($query: String, $count: Int) {
  eventInstanceCandidatesList(query: $query, count: $count) {
    ...TagEventCandidate
  }
  eventSeriesCandidatesList(query: $query, count: $count) {
    __typename
    id
    name
  }
}

query TagDances {
  dancesList(orderBy: [NAME_ASC]) {
    code
    name
    discipline
  }
}

mutation SaveOutline($input: SaveOutlineInput!) {
  saveOutline(input: $input) {
    document {
      __typename
      id
      version
    }
  }
}

# The tags come back so the cache knows whose mention list just grew.
mutation AddOutlineNode($input: AddOutlineNodeInput!) {
  addOutlineNode(input: $input) {
    documentNode {
      ...OutlineNode
      tagsList {
        __typename
        id
        cohortId
        eventInstanceId
        eventSeriesId
      }
    }
  }
}
