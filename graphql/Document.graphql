fragment DocumentNodeTag on DocumentNodeTag {
  __typename
  id
  personId
  coupleId
  cohortId
  eventInstanceId
  eventSeriesId
  competitionId
  danceCode
  taggedMonth
  discipline
}

fragment OutlineNode on DocumentNode {
  __typename
  id
  parentId
  ordering
  content
}

query TenantOutline {
  tenantDocument {
    id
    title
    version
  }
}

query Outline($root: UUID) {
  documentSubtreeList(root: $root) {
    ...OutlineNode
  }
}

query OutlineBreadcrumb($node: UUID!) {
  documentNodePathList(node: $node) {
    ...OutlineNode
  }
}

query TagDances {
  dancesList(orderBy: [NAME_ASC]) {
    code
    name
    discipline
  }
}

mutation SaveOutline($input: SaveOutlineInput!) {
  saveOutline(input: $input) {
    document {
      id
      version
    }
  }
}
