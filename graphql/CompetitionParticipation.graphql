fragment Competition on Competition {
  id
  federation
  externalId
  startDate
  checkInEnd
  status
  competitionType
  participantsTotal
  event {
    id
    externalId
    name
    startDate
    endDate
    location
    city
  }
  category {
    ...CompetitionCategoryLabel
  }
}

query Competitions(
  $condition: CompetitionCondition!
  $entryCondition: CompetitionEntryCondition
  $resultCondition: CompetitionResultCondition
  $first: Int! = 50
  $offset: Int! = 0
  $orderBy: [CompetitionsOrderBy!] = [START_DATE_ASC, CHECK_IN_END_ASC, ID_ASC]
  $withDetails: Boolean! = true
) {
  competitions(
    first: $first
    offset: $offset
    condition: $condition
    orderBy: $orderBy
  ) {
    nodes {
      id
      event { id location city }
    }
    ... @include(if: $withDetails) {
      totalCount
      nodes {
        ...Competition
        entries: entriesList(condition: $entryCondition, orderBy: COMPETITOR_ID_ASC) {
          competitionId
          competitorId
          cancelled
          competitor { id name }
        }
        results: resultsList(condition: $resultCondition, orderBy: COMPETITOR_ID_ASC) {
          competitionId
          competitorId
          competitor { id name }
          ranking
          rankingTo
          pointGain
          finalGain
          isFinal
          completionStatus
        }
      }
    }
    ... @skip(if: $withDetails) {
      pageInfo { hasNextPage }
    }
  }
}

query CompetitionSuggestionEvents(
  $participant: CompetitionParticipantCondition!
  $since: Date!
  $registeredOnly: Boolean! = false
  $offset: Int! = 0
) {
  federationEvents(
    first: 50
    offset: $offset
    condition: { suggestedFor: {
      participant: $participant, date: { since: $since }, registeredOnly: $registeredOnly
    } }
    orderBy: [START_DATE_ASC, ID_ASC]
  ) {
    totalCount
    nodes {
      ...FederationMapEvent
    }
  }
}

query CompetitionSuggestions(
  $personIds: [BigInt!]
  $coupleId: BigInt
  $cohortId: BigInt
  $since: Date!
  $eventIds: [BigInt!]!
  $registeredOnly: Boolean! = false
) {
  competitionSuggestionsList(
    personIds: $personIds
    coupleId: $coupleId
    cohortId: $cohortId
    since: $since
    eventIds: $eventIds
    registeredOnly: $registeredOnly
  ) {
    competition {
      id
      federation
      externalId
      eventId
      startDate
      checkInEnd
      competitionType
      category { ...CompetitionCategoryLabel }
    }
    status
    person { id name }
    couple {
      id
      man { id name }
      woman { id name }
    }
  }
}
