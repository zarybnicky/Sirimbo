fragment ParticipationCompetition on Competition {
  id
  federation
  externalId
  startDate
  checkInEnd
  status
  competitionType
  participantsTotal
  event {
    id
    externalId
    name
    startDate
    endDate
    location
    city
  }
  category {
    ...CompetitionCategory
  }
}

query CompetitionParticipations(
  $participant: CompetitionParticipantCondition!
  $date: CompetitionDateCondition
  $offset: Int! = 0
  $orderBy: [CompetitionsOrderBy!] = [START_DATE_ASC, CHECK_IN_END_ASC, ID_ASC]
) {
  competitions(
    first: 50
    offset: $offset
    condition: { participation: { participant: $participant, date: $date } }
    orderBy: $orderBy
  ) {
    totalCount
    nodes {
      ...ParticipationCompetition
      entries: entriesList(
        condition: { participant: $participant }
        orderBy: COMPETITOR_ID_ASC
      ) {
        competitionId
        competitorId
        cancelled
        competitor { id name }
      }
      results: resultsList(condition: { participant: $participant }, orderBy: COMPETITOR_ID_ASC) {
        competitionId
        competitorId
        competitor { id name }
        ranking
        rankingTo
        pointGain
        finalGain
        isFinal
        completionStatus
      }
    }
  }
}

query ClubCompetitionLocations(
  $participant: CompetitionParticipantCondition!
  $date: CompetitionDateCondition!
) {
  competitions(
    first: 100
    condition: { participation: { participant: $participant, date: $date } }
    orderBy: [START_DATE_ASC, ID_ASC]
  ) {
    nodes {
      id
      event { id location city }
    }
    pageInfo {
      hasNextPage
    }
  }
}

query CompetitionSuggestionEvents(
  $participant: CompetitionParticipantCondition!
  $since: Date!
  $offset: Int! = 0
) {
  federationEvents(
    first: 10
    offset: $offset
    condition: { suggestedFor: { participant: $participant, date: { since: $since } } }
    orderBy: [START_DATE_ASC, ID_ASC]
  ) {
    totalCount
    nodes {
      ...FederationMapEvent
    }
  }
}

query CompetitionSuggestions(
  $personIds: [BigInt!]
  $coupleId: BigInt
  $cohortId: BigInt
  $since: Date!
  $eventIds: [BigInt!]!
) {
  competitionSuggestionsList(
    personIds: $personIds
    coupleId: $coupleId
    cohortId: $cohortId
    since: $since
    eventIds: $eventIds
  ) {
    competition { ...ParticipationCompetition }
    person { id name }
    couple {
      id
      man { id name }
      woman { id name }
    }
  }
}
