fragment Competition on Competition {
  id
  federation
  externalId
  startDate
  checkInEnd
  status
  competitionType
  participantsTotal
  event {
    id
    externalId
    name
    startDate
    endDate
    location
    city
  }
  category {
    ...CompetitionCategoryLabel
  }
}

fragment CompetitionEntry on CompetitionEntry {
  competitionId
  competitorId
  cancelled
  competitor { id name }
}

fragment CompetitionResult on CompetitionResult {
  competitionId
  competitorId
  competitor { id name }
  ranking
  rankingTo
  pointGain
  finalGain
  isFinal
  completionStatus
}

query Competitions(
  $competitor: CompetitionParticipantCondition
  $competitorId: String
  $date: DateRangeCondition
  $first: Int! = 50
  $offset: Int! = 0
  $orderBy: [CompetitionsOrderBy!] = [START_DATE_ASC, CHECK_IN_END_ASC, ID_ASC]
  $withDetails: Boolean! = true
) {
  competitions(
    first: $first
    offset: $offset
    condition: { competitor: $competitor, competitorId: $competitorId, date: $date }
    orderBy: $orderBy
  ) {
    totalCount @include(if: $withDetails)
    nodes {
      id
      event { id location city }
      ... @include(if: $withDetails) {
        ...Competition
        entries: entriesList(condition: { competitor: $competitor, competitorId: $competitorId }, orderBy: COMPETITOR_ID_ASC) {
          ...CompetitionEntry
        }
        results: resultsList(condition: { competitor: $competitor, competitorId: $competitorId }, orderBy: COMPETITOR_ID_ASC) {
          ...CompetitionResult
        }
      }
    }
    ... @skip(if: $withDetails) {
      pageInfo { hasNextPage }
    }
  }
}

query CompetitionResults(
  $condition: CompetitionResultCondition!
  $first: Int! = 50
  $offset: Int! = 0
) {
  competitionResults(
    condition: $condition
    first: $first
    offset: $offset
    orderBy: [COMPETITION_DATE_DESC, COMPETITION_ID_DESC, COMPETITOR_ID_ASC]
  ) {
    totalCount
    nodes {
      ...ResultHighlight
    }
  }
}

query CompetitionSuggestionEvents(
  $competitor: CompetitionParticipantCondition!
  $since: Date!
  $registeredOnly: Boolean! = false
  $offset: Int! = 0
) {
  federationEvents(
    first: 50
    offset: $offset
    condition: { suggestedFor: {
      competitor: $competitor, date: { since: $since }, registeredOnly: $registeredOnly
    } }
    orderBy: [START_DATE_ASC, ID_ASC]
  ) {
    totalCount
    nodes {
      ...FederationMapEvent
    }
  }
}

query CompetitionSuggestions(
  $personIds: [BigInt!]
  $coupleId: BigInt
  $cohortId: BigInt
  $since: Date!
  $eventIds: [BigInt!]!
  $registeredOnly: Boolean! = false
) {
  competitionSuggestionsList(
    personIds: $personIds
    coupleId: $coupleId
    cohortId: $cohortId
    since: $since
    eventIds: $eventIds
    registeredOnly: $registeredOnly
  ) {
    competition {
      id
      federation
      externalId
      eventId
      startDate
      checkInEnd
      competitionType
      category { ...CompetitionCategory }
    }
    status
    person { id name }
    couple {
      id
      name
    }
  }
}
