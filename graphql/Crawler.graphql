query CrawlerOverview {
  rows: crawlerTargetSummariesList(orderBy: NATURAL) @_required {
    federation
    kind
    total
    done
    fetchPending
    fetchTransient
    fetchError
    processError
    processReady
    fetchDue
    refetchDue
    latest
  }
  failures: crawlerTargetFailureGroupsList(
    orderBy: [COUNT_DESC, FAILED_AT_DESC]
  ) @_required {
    federation
    kind
    failure
    httpStatus
    errorFingerprint
    count
  }
}

query CrawlerTarget($federation: String!, $kind: String!, $key: String!, $offset: Int! = 0) {
  crawlerTarget: crawlerTargetByFederationAndKindAndKey(
    federation: $federation
    kind: $kind
    key: $key
  ) {
    id
    federation
    kind
    key
    discoveredAt
    referenceDate
    fetchStatus
    processStatus
    lastFetchedAt
    nextFetchAt
    errorCount
    lastProcessError
    lastProcessErrorAt
    lastResponseId
    lastSuccessfulResponseId
    responses(first: 50, offset: $offset, orderBy: [FETCHED_AT_DESC, ID_DESC]) {
      totalCount
      nodes {
        id
        url
        httpStatus
        error
        fetchedAt
        sysPeriod {
          start {
            value
          }
          end {
            value
          }
        }
        lastObservedAt
        observationCount
        contentHash
      }
    }
  }
  crawlerFetchJobs(
    condition: { federation: $federation, kind: $kind, frontierKey: $key }
    first: 1
    orderBy: [JOB_UPDATED_AT_DESC, JOB_ID_DESC]
  ) {
    nodes {
      jobId
      state
      runAt
      lockedAt
      attempts
      maxAttempts
      jobError
    }
  }
}

query CrawlerResponse($id: BigInt!) {
  crawlerResponse(id: $id) {
    id
    url
    httpStatus
    error
    crawlerResponseCache {
      contentHash
      content
    }
    frontier {
      id
      federation
      kind
      key
    }
  }
}

query CrawlerTargets(
  $condition: CrawlerTargetCondition!
  $first: Int! = 50
  $offset: Int! = 0
  $orderBy: [CrawlerTargetsOrderBy!] = [KEY_ASC, ID_ASC]
) {
  crawlerTargets(
    first: $first
    offset: $offset
    condition: $condition
    orderBy: $orderBy
  ) {
    totalCount
    nodes {
      id
      federation
      kind
      key
      fetchStatus
      processStatus
      errorCount
      lastFetchedAt
      nextFetchAt
    }
  }
}

query CrawlerJobs {
  crawlerFetchJobs(orderBy: [RUN_AT_ASC, JOB_ID_ASC]) {
    nodes {
      jobId
      federation
      kind
      frontierKey
      state
      runAt
      lockedAt
      attempts
      maxAttempts
      jobError
    }
  }
}
