query CrawlerOverview($federation: String, $kind: String) {
  rows: crawlerTargetSummariesList(
    condition: { federation: $federation, kind: $kind }
    orderBy: NATURAL
  ) {
    federation
    kind
    total
    done
    fetchPending
    fetchTransient
    fetchError
    processError
    processReady
    fetchDue
    refetchDue
    latest
  }
  failures: crawlerTargetFailureGroupsList(
    condition: { federation: $federation, kind: $kind }
    orderBy: [COUNT_DESC, FAILED_AT_DESC]
  ) {
    federation
    kind
    failure
    httpStatus
    errorFingerprint
    count
  }
}

query CrawlerTarget($id: BigInt!) {
  crawlerTarget(id: $id) {
    id
    federation
    kind
    key
    discoveredAt
    fetchStatus
    processStatus
    lastFetchedAt
    nextFetchAt
    errorCount
    lastProcessError
    lastProcessErrorAt
    lastResponseId
    lastSuccessfulResponseId
  }
}

query CrawlerResponse($id: BigInt!) {
  crawlerResponse(id: $id) {
    id
    frontierId
    url
    httpStatus
    error
    crawlerResponseCache {
      contentHash
      content
    }
    frontier {
      id
      federation
      kind
      key
    }
  }
}

query CrawlerTargets(
  $condition: CrawlerTargetCondition!
  $first: Int! = 50
  $offset: Int! = 0
  $orderBy: [CrawlerTargetsOrderBy!] = [KEY_ASC, ID_ASC]
) {
  crawlerTargets(
    first: $first
    offset: $offset
    condition: $condition
    orderBy: $orderBy
  ) {
    totalCount
    nodes {
      id
      kind
      key
      fetchStatus
      processStatus
      errorCount
      lastFetchedAt
      nextFetchAt
    }
  }
}

query CrawlerResponses($id: BigInt!, $offset: Int! = 0) {
  crawlerTarget(id: $id) {
    id
    lastResponseId
    lastSuccessfulResponseId
    responses(first: 50, offset: $offset, orderBy: [FETCHED_AT_DESC, ID_DESC]) {
      totalCount
      nodes {
        id
        url
        httpStatus
        error
        fetchedAt
        sysPeriod {
          start {
            value
          }
          end {
            value
          }
        }
        lastObservedAt
        observationCount
        contentHash
      }
    }
  }
}
