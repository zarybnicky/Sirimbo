query CoupleFormPeople($personId: BigInt!, $withPerson: Boolean!) {
  people(condition: { membership: { state: CURRENT } }, orderBy: [LAST_NAME_ASC, FIRST_NAME_ASC]) {
    nodes {
      id
      name
      gender
      birthDate
      ageGroup
    }
  }
  person(id: $personId) @include(if: $withPerson) {
    id
    name
    gender
    birthDate
    ageGroup
  }
}

query CoupleList {
  couplesList(condition: { membership: { state: CURRENT }, status: ACTIVE }, orderBy: ID_ASC) {
    ...Couple
    ageGroup
    man {
      id
      cohortMembershipsList(condition: { status: ACTIVE }) {
        id
        cohort { ...CohortBasic }
      }
    }
    woman {
      id
      cohortMembershipsList(condition: { status: ACTIVE }) {
        id
        cohort { ...CohortBasic }
      }
    }
  }
}

query Couple($id: BigInt!) {
  couple(id: $id) {
    ...Couple
    ageGroup
    federationRanklistEntries(first: 100, condition: { latestSnapshot: true }) {
      nodes { ...FederationRanking }
    }
    federationCompetitors(first: 100, orderBy: [FEDERATION_ASC, EXTERNAL_ID_ASC]) {
      nodes {
        id
        federation
        externalId
        name
        categoryProgressesList(orderBy: CATEGORY_ID_ASC) {
          categoryId
          category { ...CompetitionCategory }
          points
          domesticFinals
          foreignFinals
        }
      }
    }
  }
}

mutation CreateCouple($input: CreateCoupleInput!) {
  createCouple(input: $input) {
    couple {
      ...Couple
    }
  }
}

mutation UpdateCouple($input: UpdateCoupleInput!) {
  updateCouple(input: $input) {
    couple {
      ...Couple
    }
  }
}

mutation DeleteCouple($id: BigInt!) {
  deleteCouple(input: { id: $id }) {
    __typename
  }
}


