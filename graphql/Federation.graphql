fragment CompetitionCategory on Category {
  id
  name
  class
  series
  ageGroup
  discipline
  competitorType
}

query FederationList($condition: FederationCondition, $withCounts: Boolean! = true) {
  federationsList(condition: $condition, orderBy: CODE_ASC) {
    code
    name
    events(first: 0) @include(if: $withCounts) { totalCount }
    competitions(first: 0) @include(if: $withCounts) { totalCount }
    people(first: 0) @include(if: $withCounts) { totalCount }
    competitors(first: 0) @include(if: $withCounts) { totalCount }
  }
}

query FederationEvent(
  $federation: String!
  $eventId: BigInt!
  $withCompetitions: Boolean! = false
  $competitionsOffset: Int! = 0
) {
  federationEventByFederationAndId(federation: $federation, id: $eventId) {
    id
    externalId
    name
    startDate
    endDate
    location
    streetAddress
    city
    postalCode
    country
    federationByFederation { code name }
    competitions(first: 100, offset: $competitionsOffset, orderBy: [START_DATE_ASC, CHECK_IN_END_ASC, ID_ASC]) @include(if: $withCompetitions) {
      totalCount
      nodes {
        id
        externalId
        startDate
        checkInEnd
        competitionType
        category { id name }
        entries(first: 0, condition: { cancelled: false }) { totalCount }
        results(first: 0) { totalCount }
      }
    }
  }
}

query FederationCompetition($id: BigInt!, $roundsOffset: Int! = 0, $participantsOffset: Int! = 0) {
  competition(id: $id) {
    id
    eventId
    externalId
    startDate
    checkInEnd
    competitionType
    participantsTotal
    completedAt
    category { id name }
    rounds(first: 100, offset: $roundsOffset, orderBy: [ROUND_INDEX_ASC, ID_ASC]) {
      totalCount
      nodes {
        id
        roundKey
        roundLabel
        scoringMethod
        results(first: 0) { totalCount }
      }
    }
  }
  federationCompetitors(first: 20, offset: $participantsOffset, condition: { competitionId: $id }, orderBy: [NAME_ASC, ID_ASC]) {
    totalCount
    nodes {
      id
      externalId
      name
      competitionEntries(first: 1, condition: { competitionId: $id }) {
        nodes { competitionId competitorId cancelled }
      }
      competitionResults(first: 1, condition: { competitionId: $id }) {
        nodes { competitionId competitorId ranking rankingTo startNumber pointGain finalGain completionStatus }
      }
      couplesList(condition: { status: ACTIVE }, orderBy: ID_ASC) { id }
      components(first: 2, orderBy: [ROLE_ASC, PERSON_ID_ASC]) {
        totalCount
        nodes {
          personId
          person {
            id
            externalId
            people(first: 3, orderBy: [NAME_ASC, ID_ASC]) {
              totalCount
              nodes { id name }
            }
          }
        }
      }
    }
  }
}

query FederationPerson($federation: String!, $externalId: BigInt!, $competitorsOffset: Int! = 0) {
  federationPersonByFederationAndExternalId(federation: $federation, externalId: $externalId) {
    id
    externalId
    canonicalName
    firstName
    lastName
    gender
    dob
    nationality
    ageGroup
    federationByFederation { code name }
    competitorComponents(first: 100, offset: $competitorsOffset, orderBy: COMPETITOR_ID_ASC) {
      totalCount
      nodes {
        competitorId
        role
        competitor { id externalId name competitorType }
      }
    }
    people(first: 100, orderBy: [NAME_ASC, ID_ASC]) {
      nodes {
        id
        name
        tenantMembershipsList(condition: { status: ACTIVE }) {
          id
          tenantName
        }
      }
    }
  }
}

query FederationCompetitor($federation: String!, $externalId: BigInt!, $membersOffset: Int! = 0) {
  federationCompetitorByFederationAndExternalId(federation: $federation, externalId: $externalId) {
    id
    name
    competitorType
    ageGroup
    federationByFederation { code name }
    couplesList(orderBy: [SINCE_DESC, ID_ASC]) { ...Couple }
    components(first: 100, offset: $membersOffset, orderBy: [ROLE_ASC, PERSON_ID_ASC]) {
      totalCount
      nodes {
        personId
        role
        person { id externalId canonicalName firstName lastName }
      }
    }
  }
}

query Federation(
  $federation: String!
  $events: Boolean! = false
  $people: Boolean! = false
  $competitors: Boolean! = false
  $eventCondition: FederationEventCondition
  $personCondition: FederationPersonCondition
  $competitorCondition: FederationCompetitorCondition
  $offset: Int! = 0
) {
  federation(code: $federation) {
    code
    name
    events(first: 50, offset: $offset, condition: $eventCondition, orderBy: [START_DATE_DESC, ID_DESC]) @include(if: $events) {
      totalCount
      nodes {
        id
        externalId
        name
        startDate
        endDate
        location
        city
        country
        competitions(first: 0) { totalCount }
      }
    }
    people(first: 50, offset: $offset, condition: $personCondition, orderBy: [SEARCH_NAME_ASC, EXTERNAL_ID_ASC]) @include(if: $people) {
      totalCount
      nodes {
        id
        externalId
        name: canonicalName
        firstName
        lastName
        ageGroup
      }
    }
    competitors(first: 50, offset: $offset, condition: $competitorCondition, orderBy: [NAME_ASC, EXTERNAL_ID_ASC]) @include(if: $competitors) {
      totalCount
      nodes { id externalId name ageGroup }
    }
  }
}
