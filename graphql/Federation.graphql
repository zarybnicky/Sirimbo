fragment CompetitionCategory on Category {
  id
  name
  class
  series
  ageGroup
  ageGroupDetails {
    name
  }
  discipline
  competitorType
}

fragment FederationCategoryProgress on FederationCompetitorCategoryProgress {
  competitorId
  categoryId
  competitor {
    id
    federation
  }
  category {
    id
    class
    discipline
  }
  points
  domesticFinals
  foreignFinals
}

query FederationPersonLookup($federation: String!, $externalId: BigInt!) {
  federationPersonByFederationAndExternalId(
    federation: $federation
    externalId: $externalId
  ) {
    id
    externalId
    canonicalName
    firstName
    lastName
  }
}

query FederationList($condition: FederationCondition, $withCounts: Boolean! = true) {
  federationsList(condition: $condition, orderBy: CODE_ASC) {
    code
    name
    events(first: 0) @include(if: $withCounts) {
      totalCount
    }
    competitions(first: 0) @include(if: $withCounts) {
      totalCount
    }
    people(first: 0) @include(if: $withCounts) {
      totalCount
    }
    competitors(first: 0) @include(if: $withCounts) {
      totalCount
    }
  }
}

fragment FederationRanking on RanklistEntry {
  snapshotId
  competitorId
  ranking
  rankingTo
  competitor {
    id
    name
  }
  snapshot {
    id
    asOfDate
    kind
    ranklistEntriesBySnapshotId(first: 0) {
      totalCount
    }
    ranklist {
      id
      federation
      name
      category {
        ...CompetitionCategory
        ageGroupDetails {
          age {
            start { value }
            end { value }
          }
          coupleRules(condition: { division: "General" }) {
            olderAge {
              start { value }
              end { value }
            }
          }
        }
      }
    }
  }
}

fragment OfficialPerson on FederationPerson {
  id
  externalId
  canonicalName
  firstName
  lastName
  peopleList(orderBy: [NAME_ASC, ID_ASC]) {
    id
    name
  }
}

query FederationEvent($federation: String!, $eventId: String!) {
  federationEventByFederationAndExternalId(
    federation: $federation
    externalId: $eventId
  ) {
    id
    externalId
    name
    status
    startDate
    endDate
    location
    streetAddress
    city
    postalCode
    country
    officials(first: 100, orderBy: [ROLE_ASC, PERSON_ID_ASC, DISCIPLINE_ASC]) {
      nodes {
        eventId
        personId
        role
        discipline
        grade
        person {
          ...OfficialPerson
        }
      }
    }
    federationByFederation {
      code
      name
    }
  }
}

fragment CompetitionParticipant on FederationCompetitor {
  id
  externalId
  name
  couplesList(condition: { status: ACTIVE }, orderBy: ID_ASC) {
    id
    man {
      id
      name
    }
    woman {
      id
      name
    }
  }
  peopleList(orderBy: [NAME_ASC, ID_ASC]) {
    id
    name
  }
}

query FederationCompetition($federation: String!, $competitionId: String!) {
  competition: competitionByFederationAndExternalId(
    federation: $federation
    externalId: $competitionId
  ) {
    id
    event {
      id
      externalId
      name
      status
      federationByFederation {
        code
        name
      }
    }
    externalId
    startDate
    checkInEnd
    competitionType
    participantsTotal
    completedAt
    status
    category {
      ...CompetitionCategory
    }
    officials(first: 100, orderBy: [ROLE_ASC, PERSON_ID_ASC]) {
      nodes {
        competitionId
        personId
        role
        judgeLabel
        person {
          ...OfficialPerson
        }
      }
    }
    rounds: roundsList(orderBy: [ROUND_INDEX_ASC, ID_ASC]) {
      id
      roundKey
      roundLabel
    }
    results: resultsList(orderBy: [RANKING_ASC, COMPETITOR_ID_ASC]) {
      competitionId
      competitorId
      ranking
      rankingTo
      startNumber
      pointGain
      finalGain
      isFinal
      completionStatus
      competitor {
        ...CompetitionParticipant
      }
    }
    entries: entriesList(
      condition: { hasResult: false }
      orderBy: [CANCELLED_ASC, COMPETITOR_ID_ASC]
    ) {
      competitionId
      competitorId
      cancelled
      competitor {
        ...CompetitionParticipant
      }
    }
  }
}

query FederationPerson($federation: String!, $externalId: BigInt!) {
  federationPersonByFederationAndExternalId(
    federation: $federation
    externalId: $externalId
  ) {
    id
    externalId
    canonicalName
    firstName
    lastName
    gender
    dob
    nationality
    ageGroup
    eventOfficialAssignments(first: 0) {
      totalCount
    }
    competitionOfficialAssignments(first: 0) {
      totalCount
    }
    federationByFederation {
      code
      name
    }
    licenses(first: 100, orderBy: [KIND_ASC, DISCIPLINE_ASC]) {
      nodes {
        kind
        discipline
        grade
        status
        validUntil
      }
    }
    peopleList(orderBy: [NAME_ASC, ID_ASC]) {
      id
      name
      tenantMembershipsList(condition: { status: ACTIVE }) {
        id
        tenantName
      }
      tenantTrainersList(condition: { status: ACTIVE }) {
        id
        tenantName
      }
      tenantAdministratorsList(condition: { status: ACTIVE }) {
        id
        tenantName
      }
    }
  }
}

query FederationCompetitor($id: String!) {
  federationCompetitor(id: $id) {
    id
    name
    competitorType
    ageGroup
    federationByFederation {
      code
      name
    }
    categoryProgressesList(orderBy: CATEGORY_ID_ASC) {
      categoryId
      category {
        ...CompetitionCategory
      }
      points
      domesticFinals
      foreignFinals
    }
    couplesList(orderBy: [SINCE_DESC, ID_ASC]) {
      ...Couple
    }
  }
}

query Federation($federation: String!) {
  federation(code: $federation) {
    code
    name
  }
}

query FederationEventFacets($federation: String!, $includeCancelled: Boolean!) {
  federation(code: $federation) {
    code
    eventFacets(includeCancelled: $includeCancelled) {
      years {
        year
        eventCount
        mappedEventCount
      }
    }
  }
}

fragment FederationMapEvent on FederationEvent {
  id
  externalId
  name
  startDate
  endDate
  location
  city
  country
  streetAddress
  postalCode
  venueLat
  venueLng
  competitions(first: 0) {
    totalCount
  }
}

query FederationEvents(
  $federation: String!
  $search: String
  $date: CompetitionDateCondition!
  $includeCancelled: Boolean!
) {
  federation(code: $federation) {
    code
    cancelledEvents: events(first: 0, condition: { search: $search, date: $date, status: CANCELLED }) {
      totalCount
    }
    events(
      first: 300
      condition: { search: $search, date: $date, includeCancelled: $includeCancelled }
      orderBy: [START_DATE_DESC, ID_DESC]
    ) {
      nodes {
        ...FederationMapEvent
        status
      }
    }
  }
}

query FederationPeople($federation: String!, $search: String, $offset: Int! = 0) {
  federation(code: $federation) {
    code
    people(
      first: 50
      offset: $offset
      condition: { search: $search }
      orderBy: [SEARCH_NAME_ASC, EXTERNAL_ID_ASC]
    ) {
      totalCount
      nodes {
        id
        externalId
        name: canonicalName
        firstName
        lastName
        ageGroup
      }
    }
  }
}

query FederationCompetitors(
  $federation: String!
  $search: String
  $competitorTypes: [CompetitorType!]
  $ageGroups: [String!]
  $classes: [String!]
  $disciplines: [String!]
  $competedSince: Date
  $orderByCategory: CompetitorCategoryOrder
  $competitorOrder: [FederationCompetitorsOrderBy!] = [NAME_ASC, EXTERNAL_ID_ASC]
  $offset: Int! = 0
) {
  federation(code: $federation) {
    code
    competitors(
      first: 50
      offset: $offset
      condition: {
        search: $search
        competitorTypes: $competitorTypes
        categoryProgress: {
          ageGroups: $ageGroups
          classes: $classes
          disciplines: $disciplines
        }
        competedSince: $competedSince
      }
      orderByCategory: $orderByCategory
      orderBy: $competitorOrder
    ) {
      totalCount
      nodes {
        id
        externalId
        name
        competitorType
        categoryProgressesList(orderBy: CATEGORY_ID_ASC) {
          competitorId
          categoryId
          points
          domesticFinals
          foreignFinals
          category {
            id
            ageGroup
            ageGroupDetails {
              age {
                start { value }
                end { value }
              }
              coupleRules(condition: { division: "General" }) {
                olderAge {
                  start { value }
                  end { value }
                }
              }
            }
            class
            discipline
          }
        }
      }
    }
  }
}

query FederationCompetitorFacets(
  $federation: String!
  $search: String
  $competitorTypes: [CompetitorType!]
  $ageGroups: [String!]
  $classes: [String!]
  $disciplines: [String!]
  $competedSince: Date
) {
  ageGroupsList {
    code
    age {
      start { value }
      end { value }
    }
    coupleRules(condition: { division: "General" }) {
      olderAge {
        start { value }
        end { value }
      }
    }
  }
  federation(code: $federation) {
    code
    competitorFacetsList(
      search: $search
      competitorTypes: $competitorTypes
      ageGroups: $ageGroups
      classes: $classes
      disciplines: $disciplines
      competedSince: $competedSince
    ) {
      facet
      value
      count
    }
  }
}

query FederationEventCompetitions(
  $federation: String!
  $eventId: String!
  $competitionsOffset: Int! = 0
) {
  federationEventByFederationAndExternalId(
    federation: $federation
    externalId: $eventId
  ) {
    id
    competitions(
      first: 100
      offset: $competitionsOffset
      orderBy: [START_DATE_ASC, CHECK_IN_END_ASC, ID_ASC]
    ) {
      totalCount
      nodes {
        id
        externalId
        startDate
        checkInEnd
        competitionType
        status
        category {
          ...CompetitionCategory
        }
        entries(first: 0, condition: { cancelled: false }) {
          totalCount
        }
        results(first: 0) {
          totalCount
        }
      }
    }
  }
}

query CompetitionRound(
  $federation: String!
  $competitionId: String!
  $roundKey: String!
) {
  competition: competitionByFederationAndExternalId(
    federation: $federation
    externalId: $competitionId
  ) {
    id
    externalId
    startDate
    competitionType
    category {
      ...CompetitionCategory
    }
    event {
      id
      externalId
      name
      federationByFederation {
        code
        name
      }
    }
    roundsList(orderBy: [ROUND_INDEX_ASC, ID_ASC]) {
      id
      roundKey
      roundLabel
    }
    resultsList {
      competitorId
      startNumber
    }
    round: roundsList(first: 1, condition: { roundKey: $roundKey }) {
      id
      roundKey
      roundLabel
      scoringMethod
      dancesList(orderBy: DANCE_ORDER_ASC) {
        roundId
        danceOrder
        danceCode
        dance {
          code
          name
        }
      }
      judgesList(orderBy: JUDGE_INDEX_ASC) {
        roundId
        personJudgeId
        judgeIndex
        judgeLabel
        personJudge {
          ...OfficialPerson
        }
      }
      resultsList(orderBy: [OVERALL_RANKING_ASC, COMPETITOR_ID_ASC]) {
        roundId
        competitorId
        overallRanking
        overallRankingTo
        qualifiedNext
        overallScore
        danceResults
        competitor {
          id
          externalId
          name
        }
      }
      judgeScoresList(
        orderBy: [DANCE_ORDER_ASC, COMPETITOR_ID_ASC, JUDGE_PERSON_ID_ASC, COMPONENT_ASC]
      ) {
        roundId
        danceOrder
        competitorId
        judgePersonId
        component
        score
        rawScore
      }
    }
  }
}

query FederationPersonOfficialAssignments($id: String!, $offset: Int! = 0) {
  federationEvents(
    condition: { officialPersonId: $id }
    first: 20
    offset: $offset
    orderBy: [START_DATE_DESC, ID_DESC]
  ) {
    totalCount
    nodes {
      id
      externalId
      name
      startDate
      status
      officials(first: 10, condition: { personId: $id }, orderBy: PRIMARY_KEY_ASC) {
        nodes {
          eventId
          personId
          role
          discipline
          grade
        }
      }
      competitionsList(
        condition: { officialPersonId: $id }
        orderBy: [START_DATE_ASC, ID_ASC]
      ) {
        id
        externalId
        startDate
        competitionType
        status
        category {
          ...CompetitionCategory
        }
        officials(first: 10, condition: { personId: $id }, orderBy: PRIMARY_KEY_ASC) {
          nodes {
            competitionId
            personId
            role
          }
        }
      }
    }
  }
}

query FederationPersonCompetitors(
  $federation: String!
  $externalId: BigInt!
  $competitorsOffset: Int! = 0
) {
  federationPersonByFederationAndExternalId(
    federation: $federation
    externalId: $externalId
  ) {
    id
    competitorComponents(
      first: 100
      offset: $competitorsOffset
      orderBy: COMPETITOR_ID_ASC
    ) {
      totalCount
      nodes {
        competitorId
        personId
        role
        competitor {
          id
          externalId
          name
          competitorType
        }
      }
    }
  }
}

query FederationCompetitorMembers($id: String!, $membersOffset: Int! = 0) {
  federationCompetitor(id: $id) {
    id
    components(first: 100, offset: $membersOffset, orderBy: [ROLE_ASC, PERSON_ID_ASC]) {
      totalCount
      nodes {
        competitorId
        personId
        role
        person {
          id
          externalId
          canonicalName
          firstName
          lastName
        }
      }
    }
  }
}

query FederationCompetitorHistory($id: String!, $historyOffset: Int! = 0) {
  competitions(
    first: 50
    offset: $historyOffset
    condition: { competitorId: $id }
    orderBy: [START_DATE_DESC, ID_DESC]
  ) {
    totalCount
    nodes {
      id
      externalId
      eventId
      status
      startDate
      competitionType
      event {
        id
        name
        externalId
      }
      category {
        ...CompetitionCategory
      }
      entries(first: 1, condition: { competitorId: $id }) {
        nodes {
          competitionId
          competitorId
          cancelled
        }
      }
      results(first: 1, condition: { competitorId: $id }) {
        nodes {
          competitionId
          competitorId
          ranking
          rankingTo
          pointGain
          finalGain
          isFinal
          completionStatus
        }
      }
    }
  }
}
