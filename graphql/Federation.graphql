fragment CompetitionCategory on Category {
  id
  name
  class
  series
  ageGroup
  discipline
  competitorType
}

fragment FederationCategoryProgress on FederationCompetitorCategoryProgress {
  competitorId
  categoryId
  competitor {
    id
    federation
  }
  category {
    id
    class
    discipline
  }
  points
  domesticFinals
  foreignFinals
}

query FederationPersonLookup($federation: String!, $externalId: BigInt!) {
  federationPersonByFederationAndExternalId(
    federation: $federation
    externalId: $externalId
  ) {
    id
    externalId
    canonicalName
    firstName
    lastName
  }
}

query FederationList($condition: FederationCondition, $withCounts: Boolean! = true) {
  federationsList(condition: $condition, orderBy: CODE_ASC) {
    code
    name
    events(first: 0) @include(if: $withCounts) {
      totalCount
    }
    competitions(first: 0) @include(if: $withCounts) {
      totalCount
    }
    people(first: 0) @include(if: $withCounts) {
      totalCount
    }
    competitors(first: 0) @include(if: $withCounts) {
      totalCount
    }
  }
}

query FederationEvent($federation: String!, $eventId: String!) {
  federationEventByFederationAndExternalId(
    federation: $federation
    externalId: $eventId
  ) {
    id
    externalId
    name
    status
    startDate
    endDate
    location
    streetAddress
    city
    postalCode
    country
    federationByFederation {
      code
      name
    }
  }
}

query FederationCompetition($federation: String!, $competitionId: String!) {
  competition: competitionByFederationAndExternalId(
    federation: $federation
    externalId: $competitionId
  ) {
    id
    eventId
    externalId
    startDate
    checkInEnd
    competitionType
    participantsTotal
    completedAt
    status
    category {
      id
      name
    }
  }
}

query FederationPerson($federation: String!, $externalId: BigInt!) {
  federationPersonByFederationAndExternalId(
    federation: $federation
    externalId: $externalId
  ) {
    id
    externalId
    canonicalName
    firstName
    lastName
    gender
    dob
    nationality
    ageGroup
    federationByFederation {
      code
      name
    }
    licenses(first: 100, orderBy: [KIND_ASC, DISCIPLINE_ASC]) {
      nodes {
        kind
        discipline
        grade
        status
        validUntil
      }
    }
    people(first: 100, orderBy: [NAME_ASC, ID_ASC]) {
      nodes {
        id
        name
        tenantMembershipsList(condition: { status: ACTIVE }) {
          id
          tenantName
        }
        tenantTrainersList(condition: { status: ACTIVE }) {
          id
          tenantName
        }
        tenantAdministratorsList(condition: { status: ACTIVE }) {
          id
          tenantName
        }
      }
    }
  }
}

query FederationCompetitor($id: String!) {
  federationCompetitor(id: $id) {
    id
    name
    competitorType
    ageGroup
    federationByFederation {
      code
      name
    }
    categoryProgresses(first: 100, orderBy: CATEGORY_ID_ASC) {
      nodes {
        categoryId
        category {
          id
          name
        }
        points
        domesticFinals
        foreignFinals
      }
    }
    couplesList(orderBy: [SINCE_DESC, ID_ASC]) {
      ...Couple
    }
  }
}

query Federation(
  $federation: String!
  $events: Boolean! = false
  $people: Boolean! = false
  $competitors: Boolean! = false
  $search: String
  $onDate: Date
  $competitorTypes: [CompetitorType!]
  $ageGroups: [String!]
  $classes: [String!]
  $disciplines: [String!]
  $competedSince: Date
  $orderByCategory: CompetitorCategoryOrder
  $competitorOrder: [FederationCompetitorsOrderBy!] = [NAME_ASC, EXTERNAL_ID_ASC]
  $offset: Int! = 0
) {
  federation(code: $federation) {
    code
    name
    events(
      first: 50
      offset: $offset
      condition: { search: $search, onDate: $onDate }
      orderBy: [START_DATE_DESC, ID_DESC]
    ) @include(if: $events) {
      totalCount
      nodes {
        id
        externalId
        name
        status
        startDate
        endDate
        location
        city
        country
        competitions(first: 0) {
          totalCount
        }
      }
    }
    people(
      first: 50
      offset: $offset
      condition: { search: $search }
      orderBy: [SEARCH_NAME_ASC, EXTERNAL_ID_ASC]
    ) @include(if: $people) {
      totalCount
      nodes {
        id
        externalId
        name: canonicalName
        firstName
        lastName
        ageGroup
      }
    }
    competitors(
      first: 50
      offset: $offset
      condition: {
        search: $search
        competitorTypes: $competitorTypes
        categoryProgress: {
          ageGroups: $ageGroups
          classes: $classes
          disciplines: $disciplines
        }
        competedSince: $competedSince
      }
      orderByCategory: $orderByCategory
      orderBy: $competitorOrder
    ) @include(if: $competitors) {
      totalCount
      nodes {
        id
        externalId
        name
        competitorType
        categoryProgressesList(orderBy: CATEGORY_ID_ASC) {
          competitorId
          categoryId
          points
          domesticFinals
          foreignFinals
          category {
            id
            ageGroup
            class
            discipline
          }
        }
      }
    }
    competitorFacetsList(
      search: $search
      competitorTypes: $competitorTypes
      ageGroups: $ageGroups
      classes: $classes
      disciplines: $disciplines
      competedSince: $competedSince
    ) @include(if: $competitors) {
      facet
      value
      count
    }
  }
}

query FederationEventCompetitions(
  $federation: String!
  $eventId: String!
  $competitionsOffset: Int! = 0
) {
  federationEventByFederationAndExternalId(
    federation: $federation
    externalId: $eventId
  ) {
    id
    competitions(
      first: 100
      offset: $competitionsOffset
      orderBy: [START_DATE_ASC, CHECK_IN_END_ASC, ID_ASC]
    ) {
      totalCount
      nodes {
        id
        externalId
        startDate
        checkInEnd
        competitionType
        status
        category {
          id
          name
        }
        entries(first: 0, condition: { cancelled: false }) {
          totalCount
        }
        results(first: 0) {
          totalCount
        }
      }
    }
  }
}

query CompetitionRounds($id: BigInt!) {
  competition(id: $id) {
    id
    rounds: roundsList(orderBy: [ROUND_INDEX_ASC, ID_ASC]) {
      id
      roundKey
      roundLabel
      scoringMethod
      results(first: 0) {
        totalCount
      }
    }
  }
}

query CompetitionResults($id: BigInt!) {
  competition(id: $id) {
    id
    results: resultsList(orderBy: [RANKING_ASC, COMPETITOR_ID_ASC]) {
      competitionId
      competitorId
      ranking
      rankingTo
      startNumber
      pointGain
      finalGain
      isFinal
      completionStatus
      competitor {
        id
        externalId
        name
      }
    }
  }
}

query CompetitionRegistrations($id: BigInt!) {
  competition(id: $id) {
    id
    entries: entriesList(
      condition: { hasResult: false }
      orderBy: [CANCELLED_ASC, COMPETITOR_ID_ASC]
    ) {
      competitionId
      competitorId
      cancelled
      competitor {
        id
        externalId
        name
        couplesList(condition: { status: ACTIVE }, orderBy: ID_ASC) {
          id
        }
        components(first: 2, orderBy: [ROLE_ASC, PERSON_ID_ASC]) {
          totalCount
          nodes {
            competitorId
            personId
            person {
              id
              externalId
              people(first: 3, orderBy: [NAME_ASC, ID_ASC]) {
                totalCount
                nodes {
                  id
                  name
                }
              }
            }
          }
        }
      }
    }
  }
}

query FederationPersonCompetitors(
  $federation: String!
  $externalId: BigInt!
  $competitorsOffset: Int! = 0
) {
  federationPersonByFederationAndExternalId(
    federation: $federation
    externalId: $externalId
  ) {
    id
    competitorComponents(
      first: 100
      offset: $competitorsOffset
      orderBy: COMPETITOR_ID_ASC
    ) {
      totalCount
      nodes {
        competitorId
        personId
        role
        competitor {
          id
          externalId
          name
          competitorType
        }
      }
    }
  }
}

query FederationCompetitorMembers($id: String!, $membersOffset: Int! = 0) {
  federationCompetitor(id: $id) {
    id
    components(first: 100, offset: $membersOffset, orderBy: [ROLE_ASC, PERSON_ID_ASC]) {
      totalCount
      nodes {
        competitorId
        personId
        role
        person {
          id
          externalId
          canonicalName
          firstName
          lastName
        }
      }
    }
  }
}

query FederationCompetitorHistory($id: String!, $historyOffset: Int! = 0) {
  competitions(
    first: 50
    offset: $historyOffset
    condition: { competitorId: $id }
    orderBy: [START_DATE_DESC, ID_DESC]
  ) {
    totalCount
    nodes {
      id
      externalId
      eventId
      status
      startDate
      event {
        id
        name
        externalId
      }
      category {
        id
        name
      }
      entries(first: 1, condition: { competitorId: $id }) {
        nodes {
          competitionId
          competitorId
          cancelled
        }
      }
      results(first: 1, condition: { competitorId: $id }) {
        nodes {
          competitionId
          competitorId
          ranking
          rankingTo
          pointGain
          finalGain
          isFinal
        }
      }
    }
  }
}
