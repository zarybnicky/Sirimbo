fragment Event on Event {
  seriesId
  parentId
  parent {
    id
    name
  }
  id
  name
  type
  since
  until
  locationText
  location {
    id
    name
  }
  isLocked
  isVisible
  isPublic
  hasPublicDetails
  isCancelled
  stats {
    total
    unknown
    attended
    notExcused
  }
}

query EventSeries($id: BigInt!) {
  eventSeries(id: $id) {
    id
    name
    eventsList(orderBy: SINCE_ASC) {
      ...EventWithTrainer
    }
  }
}

mutation UpdateEventSeries($id: BigInt!, $patch: EventSeriesPatch!) {
  updateEventSeries(input: { id: $id, patch: $patch }) {
    eventSeries {
      id
      name
      eventsList {
        id
      }
    }
  }
}

fragment EventWithTrainer on Event {
  ...Event
  seriesInfo {
    id
    name
    position
    length
    since
    until
  }
  summary
  capacity
  capacityUnit
  shareToken
  enableNotes
  registrationInfo {
    registrations
    people
    remainingCapacity
    my
    canRegister
  }
  approxPriceList {
    amount
    currency
  }
  eventTrainersList {
    id
    personId
    lessonsOffered
    person {
      id
      name
    }
  }
  managerPersonIds
  targetCohortsList {
    id
    cohortId
    cohort {
      id
      name
      colorRgb
    }
  }
  registrations(
    condition: { parentRegistrationId: null, registrationStatus: ACTIVE }
    first: 3
  ) {
    nodes {
      id
      person {
        id
        name
      }
      couple {
        id
        shortName
      }
    }
  }
}

fragment EventRegistrationAttendance on EventRegistration {
  id
  status
  attendanceNote
  attendanceCreatedAt
  lastAttended
  person {
    id
    name
    firstName
    lastName
  }
}

fragment EventTrainer on EventTrainer {
  id
  personId
  lessonsOffered
  lessonsRemaining
  person {
    id
    name
  }
}

fragment EventLessonRequest on EventLessonRequest {
  id
  registrationId
  lessonCount
  trainerId
  trainer {
    id
    personId
    person {
      id
      name
    }
  }
}

fragment EventRegistration on EventRegistration {
  id
  eventId
  source
  targetCohortId
  registrationStatus
  note
  createdAt
  personId
  person {
    id
    name
    firstName
    lastName
    isExternal
  }
  coupleId
  couple {
    ...Couple
  }
  lessonRequestsList {
    ...EventLessonRequest
  }
}

fragment EventWithRegistrations on Event {
  ...EventWithTrainer
  eventTrainersList {
    ...EventTrainer
  }
  registrationsList(
    condition: { parentRegistrationId: null, registrationStatus: ACTIVE }
    orderBy: PRIMARY_KEY_ASC
  ) {
    ...EventRegistration
  }
}

fragment EventParticipant on Person {
  id
  firstName
  lastName
  phone
  email
  birthDate
  taxIdentificationNumber
  cohortMembershipsList {
    id
    cohort {
      ...CohortBasic
    }
  }
}

query EventParticipantsExport($id: BigInt!) {
  event(id: $id) {
    id
    name
    type
    eventTrainersList {
      id
      person {
        id
        name
      }
    }
    registrations(condition: { registrationStatus: ACTIVE }) {
      nodes {
        id
        parentRegistrationId
        person {
          ...EventParticipant
          name
        }
        couple {
          id
          shortName
        }
      }
    }
  }
}

query EventRegistrationsExport($id: BigInt!) {
  event(id: $id) {
    ...Event
    eventTrainersList {
      id
      personId
      lessonsOffered
      person { id name }
    }
    registrationsList(
      condition: { parentRegistrationId: null, registrationStatus: ACTIVE }
      orderBy: PRIMARY_KEY_ASC
    ) {
      ...EventRegistration
      couple {
        id
        man { id name }
        woman { id name }
      }
    }
  }
}

query EventPayments($id: BigInt!) {
  event(id: $id) {
    id
    paymentsList {
      ...PaymentWithDebtors
    }
    childEventsList(orderBy: SINCE_ASC) {
      id
      paymentsList {
        ...PaymentWithDebtors
      }
    }
  }
}

fragment EventPage on Event {
  ...EventWithTrainer
  description
  coverImage {
    ...File
  }
}

query EventWithAttendance($id: BigInt!) {
  event(id: $id) {
    ...EventPage
    attendanceRegistrations: registrations(condition: { registrationStatus: ACTIVE }) {
      nodes {
        parentRegistrationId
        ...EventRegistration
        ...EventRegistrationAttendance
      }
    }
    paymentsList(first: 1) {
      id
    }
    childEventsList {
      id
      paymentsList(first: 1) {
        id
      }
    }
  }
}

query EventDescription($id: BigInt!) {
  event(id: $id) {
    id
    summary
    description
  }
}

query EventRegistrations($id: BigInt!, $withSchedule: Boolean! = false) {
  event(id: $id) @_required {
    ...EventWithRegistrations
  }
  eventsList(condition: { parentId: $id, type: LESSON }) @include(if: $withSchedule) @_required {
    ...Event
    approxPriceList {
      amount
      currency
    }
    eventTrainersList {
      ...EventTrainer
      tenantTrainer {
        id
        memberPrice45MinAmount
        currency
      }
    }
    registrationsList(
      condition: { parentRegistrationId: null, registrationStatus: ACTIVE }
    ) {
      ...EventRegistration
      childRegistrations(condition: { registrationStatus: ACTIVE }) {
        totalCount
      }
    }
  }
}

query EventFormOptions($forRegistration: Boolean! = false) {
  people(condition: { membership: { state: CURRENT } }) @include(if: $forRegistration) @_required {
    nodes {
      id
      name
      isExternal
    }
  }
  tenant: getCurrentTenant @_required {
    id
    ... @skip(if: $forRegistration) {
      cohortsList(orderBy: ORDERING_ASC) {
        id
        name
        isArchived
        cohortMembershipsList {
          id
          since
          until
          status
          person {
            id
            name
            isExternal
          }
        }
      }
      locationsList {
        id
        name
      }
      tenantTrainersList(condition: { status: ACTIVE }, orderBy: SINCE_ASC) {
        ...TenantTrainerOption
      }
      tenantMembershipsList(condition: { status: ACTIVE }) {
        id
        person {
          id
          name
          isExternal
        }
      }
    }
  }
  couplesList(condition: { membership: { state: CURRENT }, status: ACTIVE }, orderBy: ID_ASC) @_required {
    id
    name
    shortName
    status
    manId
    womanId
  }
}

query CampTrainerOverview($id: BigInt!) {
  event(id: $id) @_required {
    id
    since
    until
    eventTrainersList {
      id
      personId
      person {
        id
        name
      }
    }
  }
  eventsList(
    condition: { parentId: $id, isCancelled: false }
    orderBy: SINCE_ASC
  ) @_required {
    id
    type
    since
    until
    eventTrainersList {
      id
      personId
      person {
        id
        name
      }
      tenantTrainer {
        id
        memberPayout45MinAmount
        currency
      }
    }
  }
}

query EventList(
  $condition: EventCondition
  $orderBy: [EventsOrderBy!]
  $includeCoverImage: Boolean! = false
) {
  eventsList(condition: $condition, orderBy: $orderBy) {
    coverImage @include(if: $includeCoverImage) {
      ...File
    }
    ...EventWithTrainer
  }
}

query CalendarData(
  $since: Date!
  $until: Date!
  $withFacets: Boolean! = true
  $start: Datetime!
  $end: Datetime!
  $types: [EventType!]
  $trainerIds: [BigInt]
  $participantIds: [BigInt!]
  $participant: CompetitionParticipantCondition!
  $cohortId: BigInt
  $membership: PersonMembershipCondition! = { state: CURRENT }
  $onlyMine: Boolean
  $relevantOnly: Boolean
  $parentId: BigInt
  $locationIds: [BigInt]
  $canRegister: Boolean
  $withParticipantOptions: Boolean! = false
  $withAttendance: Boolean! = false
  $withCompetitions: Boolean! = true
  $withClubCompetitions: Boolean! = false
  $withBirthdays: Boolean! = true
) {
  eventsList(
    condition: {
      overlaps: { start: $start, end: $end }
      types: $types
      trainerIds: $trainerIds
      participant: $participant
      relevantOnly: $relevantOnly
      parentId: $parentId
      locationIds: $locationIds
      canRegister: $canRegister
    }
    orderBy: SINCE_ASC
  ) @_required {
    ...EventWithTrainer
    attendance: registrationsList(
      condition: {
        registrationStatus: ACTIVE
        participant: $participant
      }
      orderBy: PRIMARY_KEY_ASC
    ) @include(if: $withAttendance) {
      id
      status
      person { id name firstName lastName }
    }
  }
  competitions(
    first: 300
    condition: {
      date: { since: $since, until: $until }
      competitor: $participant
    }
    orderBy: [START_DATE_ASC, CHECK_IN_END_ASC, ID_ASC]
  ) @include(if: $withCompetitions) @_required {
    nodes {
      ...Competition
      entries: entriesList(condition: { competitor: $participant }) {
        ...CompetitionEntry
      }
      results: resultsList(condition: { competitor: $participant }) {
        ...CompetitionResult
      }
    }
  }
  clubCompetitions: competitions(
    first: 300
    condition: {
      date: { since: $since, until: $until }
      competitor: {}
    }
    orderBy: [START_DATE_ASC, CHECK_IN_END_ASC, ID_ASC]
  ) @include(if: $withClubCompetitions) @_required {
    nodes {
      ...Competition
      entries: entriesList(condition: { competitor: {}, cancelled: false }) {
        ...CompetitionEntry
      }
      results: resultsList(condition: { competitor: {} }) {
        ...CompetitionResult
      }
    }
  }
  officialEvents: federationEvents(
    first: 300
    condition: {
      date: { since: $since, until: $until }
      official: { ids: $participantIds, onlyMine: $onlyMine, membership: $membership }
    }
  ) @include(if: $withCompetitions) @_required {
    nodes {
      id federation externalId name startDate endDate location city
      officials(first: 300, condition: { person: { ids: $participantIds, onlyMine: $onlyMine, membership: $membership } }) {
        nodes {
          eventId
          personId
          role
          discipline
          person { ...OfficialPerson }
        }
      }
    }
  }
  officialCompetitions: competitions(
    first: 300
    condition: {
      date: { since: $since, until: $until }
      official: { ids: $participantIds, onlyMine: $onlyMine, membership: $membership }
    }
  ) @include(if: $withCompetitions) @_required {
    nodes {
      id federation startDate
      event { id externalId name startDate endDate location city }
      officials(first: 300, condition: { person: { ids: $participantIds, onlyMine: $onlyMine, membership: $membership } }) {
        nodes {
          competitionId
          personId
          role
          person { ...OfficialPerson }
        }
      }
    }
  }
  birthdays: people(
    condition: {
      birthday: { since: $since, until: $until }
      membership: $membership
      ids: $participantIds
      onlyMine: $onlyMine
    }
    orderBy: [LAST_NAME_ASC, FIRST_NAME_ASC]
  ) @include(if: $withBirthdays) @_required {
    nodes {
      id name firstName lastName
      date: birthday(since: $since)
    }
  }
  ... @include(if: $withFacets) {
    eventFacetsList(
      startRange: $start, endRange: $end, onlyTypes: $types,
      trainerIds: $trainerIds, participantIds: $participantIds,
      cohortId: $cohortId,
      onlyMine: $onlyMine, relevantOnly: $relevantOnly,
      parentId: $parentId, locationIds: $locationIds,
      canRegister: $canRegister
    ) @_required {
      facet
      value
      count
    }
    tenant: getCurrentTenant @_required {
      id
      cohortsList(orderBy: [ORDERING_ASC, NAME_ASC, PRIMARY_KEY_ASC]) {
        id name
      }
      locationsList(orderBy: [ORDERING_ASC, NAME_ASC, PRIMARY_KEY_ASC]) {
        ...LocationOption
      }
      tenantTrainersList(condition: { status: ACTIVE }, orderBy: SINCE_ASC) {
        ...TenantTrainerOption
      }
    }
    people(
      condition: { membership: { state: CURRENT } }
      orderBy: [LAST_NAME_ASC, FIRST_NAME_ASC]
    ) @include(if: $withParticipantOptions) @_required {
      nodes {
        id name
      }
    }
  }
}

mutation SaveEvents($input: SaveEventsInput!) {
  saveEvents(input: $input) {
    result {
      ...EventWithRegistrations
    }
  }
}

mutation SetEventSharing($input: SetEventSharingInput!) {
  setEventSharing(input: $input) {
    result
  }
}

mutation UpdateEvent($id: BigInt!, $patch: EventPatch!) {
  updateEvent(input: { id: $id, patch: $patch }) {
    event {
      coverImage {
        ...File
      }
      ...Event
    }
  }
}

mutation DeleteEvent($id: BigInt!) {
  deleteEvent(input: { id: $id }) {
    __typename
  }
}

mutation SetEventRegistration($input: SetEventRegistrationInput!) {
  setEventRegistration(input: $input) {
    result {
      ...EventRegistration
      registrationStatus
      event {
        id
        registrationInfo {
          remainingCapacity
        }
      }
    }
  }
}

mutation MoveEvent($input: MoveEventInput!) {
  moveEvent(input: $input) {
    result {
      id
      since
      until
      locationText
      location {
        id
        name
      }
      eventTrainersList {
        id
        personId
        person {
          id
          name
        }
      }
      managerPersonIds
    }
  }
}

mutation UpdateAttendance($input: UpdateAttendanceInput!) {
  updateAttendance(input: $input) {
    result {
      id
      status
      attendanceNote
    }
  }
}
