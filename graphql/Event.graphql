fragment EventInstance on EventInstance {
  seriesId
  parentId
  parent {
    id
    name
  }
  id
  name
  type
  since
  until
  locationText
  location {
    id
    name
  }
  isLocked
  isVisible
  isPublic
  hasPublicDetails
  isCancelled
  stats
}

query EventSeries($id: BigInt!) {
  eventSeries(id: $id) {
    id
    name
    eventsList(condition: { parentId: null }, orderBy: SINCE_ASC) {
      ...EventInstance
    }
    attendanceEventsList: eventsList(orderBy: SINCE_ASC) {
      ...EventInstance
    }
  }
}

fragment EventWithTrainer on EventInstance {
  ...EventInstance
  seriesId
  seriesInfo {
    id
    name
    position
    length
    since
    until
  }
  name
  type
  summary
  capacity
  capacityUnit
  shareToken
  enableNotes
  registrationInfo {
    registrations
    people
    remainingCapacity
    my
  }
  trainersList: eventInstanceTrainersByInstanceIdList {
    id
    personId
    lessonsOffered
    person {
      id
      name
    }
  }
  managerPersonIds
  stats
  targetCohortsList {
    id
    cohortId
    cohort {
      id
      name
      colorRgb
    }
  }
  registrations: eventInstanceRegistrationsByInstanceId(
    condition: { parentRegistrationId: null, registrationStatus: ACTIVE }
    first: 3
  ) {
    nodes {
      id
      person {
        id
        name
      }
      couple {
        id
        man {
          id
          name
          lastName
        }
        woman {
          id
          name
          lastName
        }
      }
    }
  }
}

fragment EventRegistrationAttendance on EventInstanceRegistration {
  id
  status
  attendanceNote
  attendanceCreatedAt
  lastAttended
  person {
    id
    name
    firstName
    lastName
  }
}

fragment EventInstanceTrainer on EventInstanceTrainer {
  id
  personId
  lessonsOffered
  lessonsRemaining
  person {
    id
    name
  }
}

fragment EventLessonDemand on EventLessonDemand {
  id
  registrationId
  lessonCount
  trainerId
  trainer {
    id
    person {
      id
      name
    }
  }
}

fragment EventInstanceRegistration on EventInstanceRegistration {
  id
  instanceId
  note
  createdAt
  personId
  person {
    id
    name
    firstName
    lastName
  }
  coupleId
  couple {
    ...Couple
  }
  eventLessonDemandsByRegistrationIdList {
    ...EventLessonDemand
  }
}

query EventApproxPrice($id: BigInt!) {
  eventInstance(id: $id) {
    id
    approxPriceList {
      amount
      currency
    }
  }
}

fragment EventRegistrant on Person {
  ...PersonBasic
  cohortMembershipsList {
    id
    cohort {
      ...CohortBasic
    }
  }
}

query EventExport($id: BigInt!) {
  eventInstance(id: $id) {
    id
    name
    type
    trainersList: eventInstanceTrainersByInstanceIdList {
      ...EventInstanceTrainer
    }
    registrations: eventInstanceRegistrationsByInstanceIdList(
      condition: { parentRegistrationId: null, registrationStatus: ACTIVE }
    ) {
      ...EventInstanceRegistration
      person {
        ...EventRegistrant
      }
      couple {
        id
        man {
          ...EventRegistrant
        }
        woman {
          ...EventRegistrant
        }
      }
    }
    eventExternalRegistrationsByInstanceIdList {
      ...EventExternalRegistration
    }
  }
}

query EventPayments($id: BigInt!) {
  eventInstance(id: $id) {
    id
    since
    until
    paymentsList {
      ...PaymentDetail
    }
    childEventInstancesList(orderBy: SINCE_ASC) {
      id
      since
      until
      paymentsList {
        ...PaymentDetail
      }
    }
  }
}

fragment EventPage on EventInstance {
  ...EventWithTrainer
  description
  eventExternalRegistrationsByInstanceIdList {
    ...EventExternalRegistration
  }
}

query EventWithAttendance($id: BigInt!) {
  event: eventInstance(id: $id) {
    ...EventPage
    eventInstanceRegistrationsByInstanceId(condition: { registrationStatus: ACTIVE }) {
      nodes {
        ...EventRegistrationAttendance
      }
    }
  }
}

query EventDescription($id: BigInt!) {
  eventInstance(id: $id) {
    id
    summary
    description
  }
}

query EventRegistrations($id: BigInt!) {
  eventInstance(id: $id) {
    id
    trainersList: eventInstanceTrainersByInstanceIdList {
      ...EventInstanceTrainer
    }
    registrationsList: eventInstanceRegistrationsByInstanceIdList(
      condition: { parentRegistrationId: null, registrationStatus: ACTIVE }
    ) {
      ...EventInstanceRegistration
    }
  }
  scheduledLessons: eventInstancesList(condition: { parentId: $id, type: LESSON }) {
    id
    since
    until
    locationText
    location {
      id
      name
    }
    trainersList {
      id
      personId
      person {
        id
        name
      }
      memberPrice45MinAmount
      currency
    }
    registrationsList: eventInstanceRegistrationsByInstanceIdList(
      condition: { parentRegistrationId: null, registrationStatus: ACTIVE }
    ) {
      id
      note
      personId
      person {
        id
        name
      }
      coupleId
      couple {
        ...Couple
      }
    }
  }
}

query EventRegistrationCandidates {
  tenant: getCurrentTenant {
    id
    tenantMembershipsList(condition: { status: ACTIVE }) {
      id
      person {
        id
        name
      }
    }
    tenantTrainersList(condition: { status: ACTIVE }) {
      id
      person {
        id
        name
      }
    }
    tenantAdministratorsList(condition: { status: ACTIVE }) {
      id
      person {
        id
        name
      }
    }
    couplesList {
      ...Couple
    }
  }
}

query CampTrainerOverview($id: BigInt!) {
  eventInstance(id: $id) {
    id
    since
    until
    trainersList: eventInstanceTrainersByInstanceIdList {
      id
      personId
      person {
        id
        name
      }
    }
  }
  scheduledEvents: eventInstancesList(
    condition: { parentId: $id, isCancelled: false }
    orderBy: SINCE_ASC
  ) {
    id
    type
    since
    until
    trainersList: eventInstanceTrainersByInstanceIdList {
      id
      personId
      person {
        id
        name
      }
    }
    payoutTrainers: trainersList {
      id
      personId
      memberPayout45MinAmount
      currency
    }
  }
}

query EventList {
  eventInstancesList(
    condition: { type: CAMP, parentId: null }
    orderBy: SINCE_DESC
  ) {
    ...EventWithTrainer
  }
}

query EventRange(
  $start: Datetime!
  $end: Datetime!
  $type: EventType
  $trainerIds: [BigInt]
  $participantIds: [BigInt]
  $scope: EventInstanceRangeScope,
  $parentId: BigInt
) {
  list: eventInstancesForRangeList(
    startRange: $start
    endRange: $end
    onlyType: $type,
    trainerIds: $trainerIds,
    participantIds: $participantIds,
    scope: $scope,
    parentId: $parentId
  ) {
    ...EventWithTrainer
  }
}

mutation SaveEvents($input: SaveEventsInput!) {
  saveEvents(input: $input) {
    events: eventInstances {
      id
    }
  }
}

mutation SetEventSharing($input: SetEventSharingInput!) {
  setEventSharing(input: $input) {
    string
  }
}

mutation UpdateEvent($id: BigInt!, $patch: EventInstancePatch!) {
  updateEventInstance(input: { id: $id, patch: $patch }) {
    eventInstance {
      ...EventInstance
    }
  }
}

mutation DeleteEvent($id: BigInt!) {
  deleteEventInstance(input: { id: $id }) {
    __typename
  }
}

mutation DeleteEventExternalRegistration($id: BigInt!) {
  deleteEventExternalRegistration(input: { id: $id }) {
    __typename
  }
}

fragment EventExternalRegistration on EventExternalRegistration {
  id
  birthDate
  nationality
  note
  phone
  prefixTitle
  suffixTitle
  taxIdentificationNumber
  updatedAt
  createdAt
  email
  instanceId
  firstName
  lastName
}

mutation RegisterToEventExternal($input: CreateEventExternalRegistrationInput!) {
  createEventExternalRegistration(input: $input) {
    __typename
  }
}

mutation SetLessonDemand($input: SetLessonDemandInput!) {
  setLessonDemand(input: $input) {
    eventLessonDemand {
      id
      lessonCount
      trainerId
    }
  }
}

mutation SetEventRegistration($input: SetEventInstanceRegistrationInput!) {
  setEventInstanceRegistration(input: $input) {
    eventInstanceRegistration {
      ...EventInstanceRegistration
      registrationStatus
      instance {
        id
        remainingPersonSpots
      }
    }
  }
}

mutation MoveEvent($input: MoveEventInstanceInput!) {
  moveEventInstance(input: $input) {
    eventInstance {
      id
      since
      until
      locationText
      location {
        id
        name
      }
      trainersList: eventInstanceTrainersByInstanceIdList {
        id
        personId
        person {
          id
          name
        }
      }
      managerPersonIds
    }
  }
}

mutation UpdateAttendance($input: UpdateAttendanceInput!) {
  updateAttendance(input: $input) {
    eventInstanceRegistration {
      id
      status
      attendanceNote
    }
  }
}
