fragment Event on Event {
  seriesId
  parentId
  parent {
    id
    isCancelled
    name
  }
  id
  name
  type
  since
  until
  locationText
  location {
    id
    name
  }
  isVisible
  isPublic
  hasPublicDetails
  isCancelled
  stats {
    total
    unknown
    attended
    notExcused
  }
}

query EventSeries($id: BigInt!) {
  eventSeries(id: $id) {
    id
    name
    eventsList(orderBy: SINCE_ASC) {
      ...EventWithTrainer
    }
  }
}

mutation UpdateEventSeries($id: BigInt!, $patch: EventSeriesPatch!) {
  updateEventSeries(input: { id: $id, patch: $patch }) {
    eventSeries {
      id
      name
      eventsList {
        id
      }
    }
  }
}

fragment EventWithPeople on Event {
  ...Event
  summary
  eventTrainersList {
    id
    personId
    lessonsOffered
    person {
      id
      name
    }
  }
  targetCohortsList {
    id
    cohortId
    cohort {
      id
      name
      colorRgb
    }
  }
}

fragment EventRegistrationOptions on Event {
  registrationPeriod {
    start { value inclusive }
    end { value inclusive }
  }
  seriesInfo {
    id
    name
    position
    length
    since
    until
  }
  capacity
  capacityUnit
  shareToken
  enableNotes
  registrationInfo {
    registrations
    people
    remainingCapacity
    my
    canRegister
    registrationOpen
  }
  approxPriceList {
    amount
    currency
  }
  managerPersonIds
}

fragment EventWithTrainer on Event {
  ...EventWithPeople
  ...EventRegistrationOptions
  registrations(
    condition: { parentRegistrationId: null, registrationStatus: ACTIVE }
    first: 3
  ) {
    nodes {
      id
      person {
        id
        name
      }
      couple {
        id
        shortName
      }
    }
  }
}

fragment EventRegistrationAttendance on EventRegistration {
  id
  status
  attendanceNote
  attendanceCreatedAt
  lastAttended
  person {
    id
    name
    firstName
    lastName
  }
}

fragment EventTrainer on EventTrainer {
  id
  personId
  lessonsOffered
  lessonsRemaining
  person {
    id
    name
  }
}

fragment EventLessonRequest on EventLessonRequest {
  id
  registrationId
  lessonCount
  trainerId
  trainer {
    id
    personId
    person {
      id
      name
    }
  }
}

fragment EventRegistration on EventRegistration {
  id
  eventId
  source
  targetCohortId
  registrationStatus
  note
  createdAt
  personId
  person {
    id
    name
    firstName
    lastName
    isExternal
  }
  coupleId
  couple {
    ...Couple
  }
  lessonRequestsList {
    ...EventLessonRequest
  }
}

fragment EventWithRegistrations on Event {
  ...EventWithTrainer
  eventTrainersList {
    ...EventTrainer
  }
  registrationsList(
    condition: { parentRegistrationId: null, registrationStatus: ACTIVE }
    orderBy: PRIMARY_KEY_ASC
  ) {
    ...EventRegistration
  }
}

fragment EventParticipant on Person {
  id
  firstName
  lastName
  phone
  email
  birthDate
  taxIdentificationNumber
  cohortMembershipsList {
    id
    cohort {
      ...CohortBasic
    }
  }
}

query EventParticipantsExport($id: BigInt!) {
  event(id: $id) {
    id
    name
    type
    eventTrainersList {
      id
      person {
        id
        name
      }
    }
    registrations(condition: { registrationStatus: ACTIVE }) {
      nodes {
        id
        parentRegistrationId
        person {
          ...EventParticipant
          name
        }
        couple {
          id
          shortName
        }
      }
    }
  }
}

query EventRegistrationsExport($id: BigInt!) {
  event(id: $id) {
    ...Event
    eventTrainersList {
      id
      personId
      lessonsOffered
      person { id name }
    }
    registrationsList(
      condition: { parentRegistrationId: null, registrationStatus: ACTIVE }
      orderBy: PRIMARY_KEY_ASC
    ) {
      ...EventRegistration
      couple {
        id
        man { id name }
        woman { id name }
      }
    }
  }
}

query EventPayments($id: BigInt!) {
  event(id: $id) {
    id
    paymentsList {
      ...PaymentWithDebtors
    }
    childEventsList(orderBy: SINCE_ASC) {
      id
      paymentsList {
        ...PaymentWithDebtors
      }
    }
  }
}

fragment EventPage on Event {
  ...EventWithTrainer
  description
  coverImage {
    ...File
  }
}

query EventWithAttendance($id: BigInt!) {
  event(id: $id) {
    ...EventPage
    attendanceRegistrations: registrations(condition: { registrationStatus: ACTIVE }) {
      nodes {
        parentRegistrationId
        ...EventRegistration
        ...EventRegistrationAttendance
      }
    }
    paymentsList(first: 1) {
      id
    }
    childEventsList {
      id
      type
      eventTrainersList {
        id
        personId
        person { id name }
      }
      registrationsList(condition: { parentRegistrationId: null, registrationStatus: ACTIVE }) {
        id
        personId
        coupleId
      }
      paymentsList(first: 1) {
        id
      }
    }
  }
}

query EventDescription($id: BigInt!) {
  event(id: $id) {
    id
    summary
    description
  }
}

query EventRegistrations($id: BigInt!, $withSchedule: Boolean! = false) {
  event(id: $id) @_required {
    ...EventWithRegistrations
  }
  eventsList(condition: { parentId: $id, type: LESSON }) @include(if: $withSchedule) @_required {
    ...Event
    approxPriceList {
      amount
      currency
    }
    eventTrainersList {
      ...EventTrainer
      tenantTrainer {
        id
        memberPrice45MinAmount
        currency
      }
    }
    registrationsList(
      condition: { parentRegistrationId: null, registrationStatus: ACTIVE }
    ) {
      ...EventRegistration
      childRegistrations(condition: { registrationStatus: ACTIVE }) {
        totalCount
      }
    }
  }
}

query EventFormOptions(
  $forRegistration: Boolean! = false
  $withPeople: Boolean! = false
  $peopleCondition: PersonCondition = { membership: { state: CURRENT } }
  $eventId: BigInt! = "0"
  $withRegistrations: Boolean! = false
  $withParents: Boolean! = false
) {
  parents: eventsList(condition: { type: CAMP }, orderBy: SINCE_DESC) @include(if: $withParents) {
    id
    name
    since
    until
  }
  event(id: $eventId) @include(if: $withRegistrations) {
    id
    parent {
      id
      eventTrainersList {
        id
        personId
      }
    }
  }
  registrations: eventRegistrationsList(
    condition: { eventId: $eventId, parentRegistrationId: null, registrationStatus: ACTIVE }
    orderBy: PRIMARY_KEY_ASC
  ) @include(if: $withRegistrations) @_required {
    ...EventRegistration
  }
  people(condition: $peopleCondition, orderBy: [LAST_NAME_ASC, FIRST_NAME_ASC]) @include(if: $withPeople) @_required {
    nodes {
      id
      name
      isExternal
    }
  }
  tenant: getCurrentTenant @_required {
    id
    ... @skip(if: $forRegistration) {
      cohortsList(orderBy: ORDERING_ASC) {
        id
        name
        isArchived
        cohortMembershipsList {
          id
          since
          until
          status
          person {
            id
            name
            isExternal
          }
        }
      }
      locationsList {
        id
        name
      }
      tenantTrainersList(condition: { status: ACTIVE }, orderBy: SINCE_ASC) {
        ...TenantTrainerOption
      }
      tenantMembershipsList(condition: { status: ACTIVE }) {
        id
        person {
          id
          name
          isExternal
        }
      }
    }
  }
  couplesList(condition: { membership: { state: CURRENT }, status: ACTIVE }, orderBy: ID_ASC) @_required {
    id
    name
    shortName
    status
    manId
    womanId
  }
}

query CampTrainerOverview($id: BigInt!) {
  event(id: $id) @_required {
    id
    since
    until
    eventTrainersList {
      id
      personId
      person {
        id
        name
      }
    }
  }
  eventsList(
    condition: { parentId: $id, isCancelled: false }
    orderBy: SINCE_ASC
  ) @_required {
    id
    type
    since
    until
    eventTrainersList {
      id
      personId
      person {
        id
        name
      }
      tenantTrainer {
        id
        memberPayout45MinAmount
        currency
      }
    }
  }
}

query EventList(
  $savedSearch: BigInt
  $condition: EventCondition
  $orderBy: [EventsOrderBy!]
  $includeCoverImage: Boolean! = false
) {
  eventsList(savedSearch: $savedSearch, condition: $condition, orderBy: $orderBy) {
    coverImage @include(if: $includeCoverImage) {
      ...File
    }
    ...EventWithTrainer
  }
}

fragment CalendarFederationEvent on FederationEvent {
  id
  federation
  externalId
  name
  startDate
  endDate
  location
  city
  ... @include(if: $forIcs) {
    status
    streetAddress
    postalCode
    country
    venueLat
    venueLng
  }
}

query CalendarData(
  $savedSearch: BigInt
  $withSavedSearches: Boolean! = false
  $filter: CalendarFilterInput
  $overlaps: EventRangeCondition
  $since: Date
  $until: Date
  $withFacets: Boolean! = true
  $start: Datetime
  $end: Datetime
  $withParticipantOptions: Boolean! = false
  $withAttendance: Boolean! = false
  $withEvents: Boolean! = true
  $forIcs: Boolean! = false
  $registrationLimit: Int = 3
  $offset: Int! = 0
  $withCompetitions: Boolean! = true
  $withOtherClubCompetitors: Boolean! = false
  $withBirthdays: Boolean! = true
) {
  eventSavedSearchesList(orderBy: [NAME_ASC, ID_ASC]) @include(if: $withSavedSearches) {
    ...EventSavedSearch
  }
  eventsList(
    savedSearch: $savedSearch
    calendarFilter: $filter
    condition: { overlaps: $overlaps }
    orderBy: [SINCE_ASC, ID_ASC]
  ) @include(if: $withEvents) @_required {
    ...EventWithPeople
    ...EventRegistrationOptions @skip(if: $forIcs)
    registrations(
      condition: { parentRegistrationId: null, registrationStatus: ACTIVE, excludeCohortSource: true }
      first: $registrationLimit
      orderBy: PRIMARY_KEY_ASC
    ) {
      nodes {
        id
        person { id name }
        couple { id shortName }
      }
    }
    ... @include(if: $forIcs) {
      createdAt
      updatedAt
      hasMyRegistration
      location {
        id
        longName
        latitude
        longitude
        address {
          city
          conscriptionNumber
          district
          orientationNumber
          postalCode
          region
          street
        }
      }
    }
    attendance: registrationsList(
      calendarFilter: $filter
      savedSearch: $savedSearch
      condition: { registrationStatus: ACTIVE }
      orderBy: PRIMARY_KEY_ASC
    ) @include(if: $withAttendance) {
      id
      status
      person { id name firstName lastName }
    }
  }
  viewerPeople: people(condition: { onlyMine: true }) @include(if: $withCompetitions) @skip(if: $forIcs) @_required {
    nodes {
      id
      federationPeople(first: 300) {
        nodes {
          id
          competitorComponents(first: 300) {
            nodes {
              competitorId
              personId
            }
          }
        }
      }
    }
  }
  competitions(
    savedSearch: $savedSearch
    calendarFilter: $filter
    first: 300
    offset: $offset
    condition: {
      includeCancelled: false
      date: { since: $since, until: $until }
    }
    orderBy: [START_DATE_ASC, CHECK_IN_END_ASC, ID_ASC]
  ) @include(if: $withCompetitions) @_required {
    pageInfo { hasNextPage }
    nodes {
      ...Competition
      event {
        ...CalendarFederationEvent
        clubCompetitions: competitions(
          first: 300
          condition: {
            includeCancelled: false
            date: { since: $since, until: $until }
            competitor: {}
          }
          orderBy: [START_DATE_ASC, CHECK_IN_END_ASC, ID_ASC]
        ) @include(if: $withOtherClubCompetitors) {
          nodes {
            ...Competition
            entries: entriesList(condition: { competitor: {}, cancelled: false }) {
              ...CompetitionEntry
            }
            results: resultsList(condition: { competitor: {} }) {
              ...CompetitionResult
            }
          }
        }
      }
      entries: entriesList(calendarFilter: $filter, savedSearch: $savedSearch) {
        ...CompetitionEntry
      }
      results: resultsList(calendarFilter: $filter, savedSearch: $savedSearch) {
        ...CompetitionResult
      }
      officials(first: 300, calendarFilter: $filter, savedSearch: $savedSearch) {
        nodes {
          competitionId
          personId
          role
          person { ...OfficialPerson }
        }
      }
    }
  }
  officialEvents: federationEvents(
    savedSearch: $savedSearch
    calendarFilter: $filter
    first: 300
    offset: $offset
    condition: {
      includeCancelled: false
      date: { since: $since, until: $until }
    }
    orderBy: [START_DATE_ASC, ID_ASC]
  ) @include(if: $withCompetitions) @_required {
    pageInfo { hasNextPage }
    nodes {
      ...CalendarFederationEvent
      officials(first: 300, calendarFilter: $filter, savedSearch: $savedSearch) {
        nodes {
          eventId
          personId
          role
          discipline
          person { ...OfficialPerson }
        }
      }
    }
  }
  birthdays: people(
    calendarFilter: $filter
    savedSearch: $savedSearch
    condition: { birthday: { since: $since, until: $until } }
    orderBy: [LAST_NAME_ASC, FIRST_NAME_ASC]
  ) @include(if: $withBirthdays) @skip(if: $forIcs) @_required {
    nodes {
      id name firstName lastName
      date: birthday(since: $since)
    }
  }
  ... @include(if: $withFacets) @skip(if: $forIcs) {
    eventFacetsList(
      startRange: $start, endRange: $end, calendarFilter: $filter, savedSearch: $savedSearch
    ) @_required {
      facet
      value
      count
    }
    tenant: getCurrentTenant @_required {
      id
      cohortsList(orderBy: [ORDERING_ASC, NAME_ASC, PRIMARY_KEY_ASC]) {
        id name
      }
      locationsList(orderBy: [ORDERING_ASC, NAME_ASC, PRIMARY_KEY_ASC]) {
        ...LocationOption
      }
      tenantTrainersList(condition: { status: ACTIVE }, orderBy: SINCE_ASC) {
        ...TenantTrainerOption
      }
    }
    people(
      condition: { membership: { state: CURRENT } }
      orderBy: [LAST_NAME_ASC, FIRST_NAME_ASC]
    ) @include(if: $withParticipantOptions) @_required {
      nodes {
        id name
      }
    }
  }
}

mutation SaveEvents($input: SaveEventsInput!) {
  saveEvents(input: $input) {
    result {
      ...EventWithRegistrations
    }
  }
}

mutation SetEventSharing($input: SetEventSharingInput!) {
  setEventSharing(input: $input) {
    result
  }
}

mutation UpdateEvent($id: BigInt!, $patch: EventPatch!) {
  updateEvent(input: { id: $id, patch: $patch }) {
    event {
      coverImage {
        ...File
      }
      ...Event
    }
  }
}

mutation DeleteEvent($id: BigInt!) {
  deleteEvent(input: { id: $id }) {
    __typename
  }
}

mutation SetEventRegistration($input: SetEventRegistrationInput!) {
  setEventRegistration(input: $input) {
    result {
      ...EventRegistration
      registrationStatus
      event {
        id
        registrationInfo {
          remainingCapacity
        }
      }
    }
  }
}

mutation MoveEvent($input: MoveEventInput!) {
  moveEvent(input: $input) {
    result {
      id
      since
      until
      locationText
      location {
        id
        name
      }
      eventTrainersList {
        id
        personId
        person {
          id
          name
        }
      }
      managerPersonIds
    }
  }
}

mutation UpdateAttendance($input: UpdateAttendanceInput!) {
  updateAttendance(input: $input) {
    result {
      id
      status
      attendanceNote
    }
  }
}

fragment EventSavedSearch on EventSavedSearch {
  id
  name
  crossTenant
  feedKey
  condition {
    types
    trainerIds
    locationIds
    participantIds
    parentId
    cohortId
    onlyMine
    relevantOnly
    canRegister
    withCompetitions
  }
}

mutation CreateEventSavedSearch($input: EventSavedSearchInput!) {
  createEventSavedSearch(input: { eventSavedSearch: $input }) {
    eventSavedSearch {
      ...EventSavedSearch
    }
  }
}

mutation UpdateEventSavedSearch($id: BigInt!, $patch: EventSavedSearchPatch!) {
  updateEventSavedSearch(input: { id: $id, patch: $patch }) {
    eventSavedSearch {
      ...EventSavedSearch
    }
  }
}
