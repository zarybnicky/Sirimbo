fragment Event on Event {
  seriesId
  parentId
  parent {
    id
    name
  }
  id
  name
  type
  since
  until
  locationText
  location {
    id
    name
  }
  isLocked
  isVisible
  isPublic
  hasPublicDetails
  isCancelled
  stats
}

query EventSeries($id: BigInt!) {
  eventSeries(id: $id) {
    id
    name
    eventsList(orderBy: SINCE_ASC) {
      ...EventWithTrainer
    }
  }
}

mutation UpdateEventSeries($id: BigInt!, $patch: EventSeriesPatch!) {
  updateEventSeries(input: { id: $id, patch: $patch }) {
    eventSeries {
      id
      name
      eventsList {
        id
      }
    }
  }
}

fragment EventWithTrainer on Event {
  ...Event
  seriesId
  seriesInfo {
    id
    name
    position
    length
    since
    until
  }
  name
  type
  summary
  capacity
  capacityUnit
  shareToken
  enableNotes
  registrationInfo {
    registrations
    people
    remainingCapacity
    my
  }
  approxPriceList {
    amount
    currency
  }
  trainersList: eventTrainersList {
    id
    personId
    lessonsOffered
    person {
      id
      name
    }
  }
  managerPersonIds
  stats
  targetCohortsList {
    id
    cohortId
    cohort {
      id
      name
      colorRgb
    }
  }
  registrations(
    condition: { parentRegistrationId: null, registrationStatus: ACTIVE }
    first: 3
  ) {
    nodes {
      id
      person {
        id
        name
      }
      couple {
        id
        man {
          id
          name
          lastName
        }
        woman {
          id
          name
          lastName
        }
      }
    }
  }
}

fragment EventRegistrationAttendance on EventRegistration {
  id
  status
  attendanceNote
  attendanceCreatedAt
  lastAttended
  person {
    id
    name
    firstName
    lastName
  }
}

fragment EventTrainer on EventTrainer {
  id
  personId
  lessonsOffered
  lessonsRemaining
  person {
    id
    name
  }
}

fragment EventLessonRequest on EventLessonRequest {
  id
  registrationId
  lessonCount
  trainerId
  trainer {
    id
    personId
    person {
      id
      name
    }
  }
}

fragment EventRegistration on EventRegistration {
  id
  eventId
  source
  targetCohortId
  registrationStatus
  note
  createdAt
  personId
  person {
    id
    name
    firstName
    lastName
  }
  coupleId
  couple {
    ...Couple
  }
  requests: lessonRequestsList {
    ...EventLessonRequest
  }
}

fragment EventRegistrant on Person {
  id
  firstName
  lastName
  phone
  email
  birthDate
  taxIdentificationNumber
  cohortMembershipsList {
    id
    cohort {
      ...CohortBasic
    }
  }
}

query EventParticipantsExport($id: BigInt!) {
  event(id: $id) {
    id
    name
    type
    trainersList: eventTrainersList {
      id
      person {
        id
        name
      }
    }
    registrations(condition: { registrationStatus: ACTIVE }) {
      nodes {
        id
        parentRegistrationId
        person {
          ...EventRegistrant
          name
        }
        couple {
          id
          man {
            id
            lastName
          }
          woman {
            id
            lastName
          }
        }
      }
    }
  }
}

query EventExport($id: BigInt!) {
  event(id: $id) {
    id
    name
    type
    trainersList: eventTrainersList {
      ...EventTrainer
    }
    registrations(
      condition: { parentRegistrationId: null, registrationStatus: ACTIVE }
    ) {
      totalCount
      nodes {
        ...EventRegistration
      }
    }
  }
}

query EventPayments($id: BigInt!) {
  event(id: $id) {
    id
    paymentsList {
      ...PaymentDetail
    }
    childEventsList(orderBy: SINCE_ASC) {
      id
      paymentsList {
        ...PaymentDetail
      }
    }
  }
}

fragment EventPage on Event {
  ...EventWithTrainer
  description
}

query EventWithAttendance($id: BigInt!) {
  event(id: $id) {
    ...EventPage
    attendanceRegistrations: registrations(condition: { registrationStatus: ACTIVE }) {
      nodes {
        parentRegistrationId
        ...EventRegistration
        ...EventRegistrationAttendance
        person {
          id
          isMember
          isTrainer
          isAdmin
        }
      }
    }
    paymentsList(first: 1) {
      id
    }
    childEventsList {
      id
      paymentsList(first: 1) {
        id
      }
    }
  }
}

query EventDescription($id: BigInt!) {
  event(id: $id) {
    id
    summary
    description
  }
}

query EventEditorRegistrations($id: BigInt!) {
  event(id: $id) {
    id
    registrationsList(
      condition: { parentRegistrationId: null, registrationStatus: ACTIVE }
    ) {
      ...EventRegistration
      person {
        id
        isMember
        isTrainer
        isAdmin
      }
    }
  }
}

query EventRegistrationDialog($id: BigInt!) {
  instance: event(id: $id) {
    id
    type
    isLocked
    enableNotes
    capacityUnit
    managerPersonIds
    registrationInfo {
      remainingCapacity
    }
    trainersList: eventTrainersList {
      ...EventTrainer
    }
    registrationsList(
      condition: { parentRegistrationId: null, registrationStatus: ACTIVE }
    ) {
      ...EventRegistration
    }
  }
}

query EventRegistrations($id: BigInt!) {
  event(id: $id) {
    id
    trainersList: eventTrainersList {
      ...EventTrainer
    }
    registrationsList(
      condition: { parentRegistrationId: null, registrationStatus: ACTIVE }
    ) {
      ...EventRegistration
    }
  }
  scheduledLessons: eventsList(condition: { parentId: $id, type: LESSON }) {
    id
    since
    until
    locationText
    location {
      id
      name
    }
    trainersList: eventTrainersList {
      id
      personId
      person {
        id
        name
      }
      tenantTrainer {
        id
        memberPrice45MinAmount
        currency
      }
    }
    registrationsList(
      condition: { parentRegistrationId: null, registrationStatus: ACTIVE }
    ) {
      id
      note
      personId
      person {
        id
        name
      }
      coupleId
      couple {
        ...Couple
      }
    }
  }
}

query EventRegistrationCandidates {
  people(condition: { membership: { state: CURRENT } }) {
    nodes {
      id
      name
      isMember
      isTrainer
      isAdmin
    }
  }
  tenant: getCurrentTenant {
    id
    couplesList {
      ...Couple
    }
  }
}

query EventFormOptions {
  tenant: getCurrentTenant {
    id
    cohortsList(orderBy: ORDERING_ASC) {
      id
      name
      isArchived
      cohortMembershipsList {
        id
        since
        until
        status
        person {
          id
          name
          isMember
          isTrainer
          isAdmin
        }
      }
    }
    locationsList {
      id
      name
    }
    tenantTrainersList(condition: { status: ACTIVE }, orderBy: SINCE_ASC) {
      id
      person {
        id
        name
      }
    }
    tenantMembershipsList(condition: { status: ACTIVE }) {
      id
      person {
        id
        name
        isMember
        isTrainer
        isAdmin
      }
    }
    couplesList {
      id
      status
      man {
        id
        name
      }
      woman {
        id
        name
      }
    }
  }
}

query CampTrainerOverview($id: BigInt!) {
  event(id: $id) {
    id
    since
    until
    trainersList: eventTrainersList {
      id
      personId
      person {
        id
        name
      }
    }
  }
  scheduledEvents: eventsList(
    condition: { parentId: $id, isCancelled: false }
    orderBy: SINCE_ASC
  ) {
    id
    type
    since
    until
    trainersList: eventTrainersList {
      id
      personId
      person {
        id
        name
      }
      tenantTrainer {
        id
        memberPayout45MinAmount
        currency
      }
    }
  }
}

query EventList {
  eventsList(
    condition: { type: CAMP, parentId: null }
    orderBy: SINCE_DESC
  ) {
    ...EventWithTrainer
  }
}

query EventRange(
  $start: Datetime!
  $end: Datetime!
  $types: [EventType!]
  $trainerIds: [BigInt]
  $participantIds: [BigInt]
  $scope: EventInstanceRangeScope,
  $parentId: BigInt
  $locationIds: [BigInt]
) {
  list: eventInstancesForRangeList(
    startRange: $start
    endRange: $end
    onlyType: null
    onlyTypes: $types
    trainerIds: $trainerIds,
    participantIds: $participantIds,
    scope: $scope,
    parentId: $parentId
    locationIds: $locationIds
  ) {
    ...EventWithTrainer
  }
}

query CalendarFacets(
  $start: Datetime!
  $end: Datetime!
  $types: [EventType!]
  $trainerIds: [BigInt]
  $participantIds: [BigInt]
  $scope: EventInstanceRangeScope
  $parentId: BigInt
  $locationIds: [BigInt]
) {
  eventFacetsList(
    startRange: $start, endRange: $end, onlyTypes: $types,
    trainerIds: $trainerIds, participantIds: $participantIds,
    scope: $scope, parentId: $parentId, locationIds: $locationIds
  ) {
    facet
    value
    count
  }
}

mutation SaveEvents($input: SaveEventsInput!) {
  saveEvents(input: $input) {
    result {
      id
    }
  }
}

mutation SetEventSharing($input: SetEventSharingInput!) {
  setEventSharing(input: $input) {
    result
  }
}

mutation UpdateEvent($id: BigInt!, $patch: EventPatch!) {
  updateEvent(input: { id: $id, patch: $patch }) {
    event {
      ...Event
    }
  }
}

mutation DeleteEvent($id: BigInt!) {
  deleteEvent(input: { id: $id }) {
    __typename
  }
}

mutation SetLessonRequest($input: SetLessonRequestInput!) {
  setLessonRequest(input: $input) {
    result {
      id
      lessonCount
      trainerId
    }
  }
}

mutation SetEventRegistration($input: SetEventRegistrationInput!) {
  setEventRegistration(input: $input) {
    result {
      ...EventRegistration
      registrationStatus
      event {
        id
        remainingPersonSpots
      }
    }
  }
}

mutation MoveEvent($input: MoveEventInput!) {
  moveEvent(input: $input) {
    result {
      id
      since
      until
      locationText
      location {
        id
        name
      }
      trainersList: eventTrainersList {
        id
        personId
        person {
          id
          name
        }
      }
      managerPersonIds
    }
  }
}

mutation UpdateAttendance($input: UpdateAttendanceInput!) {
  updateAttendance(input: $input) {
    result {
      id
      status
      attendanceNote
    }
  }
}
