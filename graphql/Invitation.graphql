
mutation ResendInvitation($id: BigInt!) {
  resendPersonInvitation(input: { invitationId: $id }) {
    __typename
  }
}

mutation CreateInvitation($input: CreatePersonInvitationInput!) {
  createPersonInvitation(input: $input) {
    personInvitation {
      id
      email
      createdAt
    }
  }
}

mutation DeleteInvitation($input: DeletePersonInvitationInput!) {
  deletePersonInvitation(input: $input) {
    __typename
  }
}

query InvitationInfo($token: UUID!) {
  invitationInfo(token: $token)
  invitationName(token: $token)
}
