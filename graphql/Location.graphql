fragment LocationOption on Location {
  id
  name
  showInLists
}

fragment Location on Location {
  ...LocationOption
  tenantId
  longName
  description
  ordering
  latitude
  longitude
  coverImageId
  coverImage {
    ...File
  }
  imagesList {
    fileId
    file {
      ...File
    }
  }
  address {
    city
    conscriptionNumber
    district
    orientationNumber
    postalCode
    region
    street
  }
}

fragment LocationSummary on Location {
  ...LocationOption
  coverImage {
    id
    url
  }
  address {
    city
    conscriptionNumber
    district
    orientationNumber
    postalCode
    region
    street
  }
}

query PublicLocations {
  tenant: getCurrentTenant {
    id
    locationsList(condition: { showInLists: true }, orderBy: [ORDERING_ASC, NAME_ASC, PRIMARY_KEY_ASC]) {
      ...Location
    }
  }
}

query Location(
  $id: BigInt!
  $eventsCondition: EventCondition
  $withEvents: Boolean! = false
) {
  location(id: $id) {
    ...Location
  }
  eventsList(
    first: 10
    condition: $eventsCondition
    orderBy: SINCE_ASC
  ) @include(if: $withEvents) {
    ...EventWithTrainer
  }
}

mutation UpsertLocation($input: UpsertLocationInput!) {
  upsertLocation(input: $input) {
    result {
      id
      tenantId
    }
  }
}
