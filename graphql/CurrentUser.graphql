fragment UserAuth on User {
  id
  uLogin
  uEmail
  userProxiesList(condition: { status: ACTIVE }) {
    id
    person {
      ...Person
      allCouplesList {
        ...Couple
      }
    }
  }
}

query CurrentUser($versionId: String, $withRefreshJwt: Boolean! = false) {
  currentClaims
  refreshJwt @include(if: $withRefreshJwt)
  getCurrentUser(versionId: $versionId) {
    ...UserAuth
  }
}

query UserList {
  users {
    nodes {
      id
      uLogin
      uEmail
    }
  }
}

query UserDetail($id: BigInt!) {
  user(id: $id) {
    id
    uEmail
    uLogin
    uJmeno
    uPrijmeni
    createdAt
    lastActiveAt
    lastLogin
    lastVersion
    tenantId
    userProxiesList(orderBy: CREATED_AT_ASC) {
      id
      since
      until
      status
      personId
      person {
        ...Person
      }
    }
  }
}

mutation LogInAs($id: BigInt!) {
  logInAs(input: { id: $id }) {
    result {
      jwt
      usr {
        ...UserAuth
      }
    }
  }
}

mutation Login($login: String!, $passwd: String!) {
  login(input: { login: $login, passwd: $passwd }) {
    result {
      jwt
      usr {
        ...UserAuth
      }
    }
  }
}

mutation OtpLogin($token: UUID!) {
  otpLogin(input: { token: $token }) {
    result {
      jwt
      usr {
        ...UserAuth
      }
    }
  }
}

mutation ResetPassword($input: ResetPasswordInput!) {
  resetPassword(input: $input) {
    __typename
  }
}

mutation ChangePassword($input: ChangePasswordInput!) {
  changePassword(input: $input) {
    __typename
  }
}

mutation RegisterWithoutInvitation($input: RegisterWithoutInvitationInput!) {
  registerWithoutInvitation(input: $input) {
    result {
      jwt
      usr {
        ...UserAuth
      }
    }
  }
}

mutation RegisterUsingInvitation($input: RegisterUsingInvitationInput!) {
  registerUsingInvitation(input: $input) {
    result {
      jwt
      usr {
        ...UserAuth
      }
    }
  }
}

query InvitationInfo($token: UUID!) {
  invitationInfo(token: $token)
  invitationName(token: $token)
}

query TenantSettings($tenantId: BigInt!) {
  tenantSetting(tenantId: $tenantId) {
    tenantId
    settings
  }
}

mutation UpdateTenantSettings($input: UpdateTenantSettingsKeyInput!) {
  updateTenantSettingsKey(input: $input) {
    tenantSetting {
      tenantId
      settings
    }
  }
}
