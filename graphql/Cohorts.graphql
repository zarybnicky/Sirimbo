fragment CohortBasic on Cohort {
  id
  name
  colorRgb
}

fragment Cohort on Cohort {
  imageId
  image {
    ...File
  }
  id
  name
  location
  isVisible
  isArchived
  colorRgb
  ordering
  description
  cohortGroupId
  externalIds
}

fragment CohortMember on CohortMembership {
  ...CohortMembership
  person {
    ...PersonBasic
    lastActivity {
      webAt
      cardEntryAt
      trainingAt
      competitionOn
    }
    ...PersonHistogram
  }
}

query CohortList(
  $first: Int
  $offset: Int
  $visible: Boolean
  $archived: Boolean
  $withDetails: Boolean! = false
  $withMembers: Boolean! = false
) {
  cohortsList(first: $first, offset: $offset, condition: {isVisible: $visible, isArchived: $archived}, orderBy: [ORDERING_ASC]) {
    ...CohortBasic
    isVisible
    externalIds
    ...Cohort @include(if: $withDetails)
    cohortMembershipsList(condition: {status: ACTIVE}) @include(if: $withDetails) {
      id
      person @include(if: $withMembers) { ...PersonHistogram }
    }
  }
  people(condition: { membership: { state: CURRENT } }, orderBy: [LAST_NAME_ASC, FIRST_NAME_ASC]) @include(if: $withMembers) {
    nodes {
      ...PersonHistogram
      cohortIds
    }
  }
}

query Cohort($id: BigInt!, $withMembers: Boolean! = false) {
  cohort(id: $id) {
    ...Cohort
    cohortMembershipsList(condition: { status: ACTIVE }) @include(if: $withMembers) {
      ...CohortMember
    }
  }
}

mutation CreateCohort($input: CohortInput!) {
  createCohort(input: {cohort: $input}) {
    cohort {
      ...Cohort
    }
  }
}

mutation UpdateCohort($id: BigInt!, $patch: CohortPatch!) {
  updateCohort(input: {id: $id, patch: $patch}) {
    cohort {
      ...Cohort
    }
  }
}

mutation ArchiveCohort($id: BigInt!) {
  archiveCohort(input: {cohortId: $id}) {
    __typename
  }
}

mutation SyncCohortMemberships($input: SyncCohortMembershipsInput!) {
  syncCohortMemberships(input: $input) {
    __typename
  }
}

fragment PersonHistogram on Person {
  id
  name
  ageGroup
  cstsId
  federationCategoryProgresses(first: 100) {
    nodes { ...FederationCategoryProgress }
  }
}
