fragment Posting on Posting {
  id
  amount
  transaction {
    id
    description
    effectiveDate
    payment {
      ...Payment
    }
  }
}

fragment Payment on Payment {
  id
  status
  isAutoCreditAllowed
  dueAt
  paidAt
  createdAt
  variableSymbol
  specificSymbol
  cohortSubscription {
    id
    cohort {
      id
      name
    }
  }
  event {
    id
    name
    since
    until
    type
    eventTrainersList {
      id
      personId
      person {
        id
        name
      }
    }
    registrations(
      condition: { parentRegistrationId: null, registrationStatus: ACTIVE }
      first: 3
    ) {
      nodes {
        id
        person {
          id
          name
        }
        couple {
          id
          shortName
        }
      }
    }
  }
}

fragment PaymentWithDebtors on Payment {
  ...Payment
  paymentDebtorsList(orderBy: PRIMARY_KEY_ASC) {
    id
    person {
      id
      name
    }
    price {
      amount
      currency
    }
  }
}

fragment PaymentDetail on Payment {
  ...PaymentWithDebtors
  transactions {
    nodes {
      id
      description
      effectiveDate
      postingsList {
        id
        amount
        account {
          ...Account
        }
      }
    }
  }
}

fragment Account on Account {
  id
  balance
  currency
  tenantId
  personId
  person {
    id
    name
    firstName
    lastName
  }
}

query Payment($id: BigInt!) {
  payment(id: $id) {
    ...PaymentDetail
    event {
      ...EventWithTrainer
    }
  }
}

mutation DeletePayment($id: BigInt!) {
  deletePayment(input: { id: $id }) {
    __typename
  }
}

mutation DeleteTransaction($id: BigInt!) {
  deleteTransaction(input: { id: $id }) {
    __typename
  }
}

mutation CreateCreditTransaction($input: CreateCreditTransactionForPersonInput!) {
  createCreditTransactionForPerson(input: $input) {
    result {
      id
      effectiveDate
      postingsList {
        id
        amount
        account {
          ...Account
        }
      }
    }
  }
}

mutation MarkAsPaid($id: BigInt!) {
  updatePayment(input: { id: $id, patch: {status: PAID} } ) {
    payment {
      id
      status
    }
  }
}

mutation SavePaymentGroup($groupId: BigInt!, $payments: [PaymentGroupItemInput]!) {
  savePaymentGroup(input: { groupId: $groupId, payments: $payments }) {
    result {
      ...PaymentWithDebtors
    }
  }
}

query PaymentGroups($condition: CohortSubscriptionCondition) {
  groups: cohortSubscriptionsList(orderBy: PRIMARY_KEY_ASC) {
    id
    cohort { id name }
  }
  selected: cohortSubscriptionsList(first: 1, condition: $condition, orderBy: PRIMARY_KEY_ASC) {
    id
    currency
    cohort {
      id
      cohortMembershipsList {
        id
        since
        until
        person { id name }
      }
    }
    paymentsList {
      id
      dueAt
      status
      paymentDebtorsList {
        id
        price { amount }
        person { id name }
      }
    }
  }
}

query TransactionAccounts {
  accountsList {
    ...Account
  }
}

query PaymentListOptions($status: PaymentStatus, $kind: PaymentKind, $personIds: [BigInt], $search: String) {
  paymentFacetsList(onlyStatus: $status, onlyKind: $kind, personIds: $personIds, search: $search) @_required {
    facet
    value
    count
    label
  }
}

query TransactionFacets($since: Datetime, $until: Datetime, $sources: [TransactionSource], $accountIds: [BigInt], $search: String) {
  transactionFacetsList(since: $since, until: $until, sources: $sources, accountIds: $accountIds, search: $search) @_required {
    facet
    value
    count
  }
}

query PaymentList($first: Int!, $offset: Int!, $condition: PaymentCondition!) {
  payments(
    first: $first
    offset: $offset
    orderBy: [CREATED_AT_DESC, ID_DESC]
    condition: $condition
  ) {
    totalCount
    nodes {
      ...PaymentWithDebtors
    }
  }
}

query Transactions(
  $first: Int!
  $offset: Int!
  $condition: TransactionCondition!
  $accountIds: [BigInt!]
) {
  transactions(
    first: $first
    offset: $offset
    orderBy: [EFFECTIVE_DATE_DESC, ID_DESC]
    condition: $condition
  ) {
    totalCount
    nodes {
      id
      description
      effectiveDate
      source
      payment {
        ...Payment
      }
      postingsList(condition: { accountIds: $accountIds }) {
        id
        amount
        account {
          ...Account
        }
      }
    }
  }
}
