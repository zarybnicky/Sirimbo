fragment Posting on Posting {
  id
  amount
  transaction {
    id
    description
    effectiveDate
    payment {
      ...Payment
    }
  }
}

fragment Payment on Payment {
  id
  status
  isAutoCreditAllowed
  dueAt
  paidAt
  createdAt
  variableSymbol
  specificSymbol
  cohortSubscription {
    id
    cohort {
      id
      name
    }
  }
  event {
    id
    name
    since
    until
    type
    eventTrainersList {
      id
      personId
      person {
        id
        name
      }
    }
    registrations(
      condition: { parentRegistrationId: null, registrationStatus: ACTIVE }
      first: 3
    ) {
      nodes {
        id
        person {
          id
          name
        }
        couple {
          id
          man {
            id
            name
            lastName
          }
          woman {
            id
            name
            lastName
          }
        }
      }
    }
  }
}

fragment PaymentDetail on Payment {
  ...Payment
  paymentDebtorsList {
    id
    person {
      id
      name
    }
    price {
      amount
      currency
    }
  }
  transactions {
    nodes {
      id
      description
      effectiveDate
      postingsList {
        id
        amount
        account {
          ...Account
        }
      }
    }
  }
}

fragment Account on Account {
  id
  balance
  currency
  tenantId
  personId
  person {
    id
    name
    firstName
    lastName
  }
}

query Payment($id: BigInt!) {
  payment(id: $id) {
    ...PaymentDetail
    event {
      ...EventWithTrainer
    }
  }
}

mutation DeletePayment($id: BigInt!) {
  deletePayment(input: { id: $id }) {
    __typename
  }
}

mutation DeleteTransaction($id: BigInt!) {
  deleteTransaction(input: { id: $id }) {
    __typename
  }
}

mutation CreateCreditTransaction($input: CreateCreditTransactionForPersonInput!) {
  createCreditTransactionForPerson(input: $input) {
    result {
      id
      effectiveDate
      postingsList {
        id
        amount
        account {
          ...Account
        }
      }
    }
  }
}

query BalanceSheet($since: Datetime, $until: Datetime) {
  accountsList {
    ...Account
    assets(since: $since, until: $until)
    liabilities(since: $since, until: $until)
  }
}

mutation MarkAsPaid($id: BigInt!) {
  updatePayment(input: { id: $id, patch: {status: PAID} } ) {
    payment {
      id
      status
    }
  }
}

query TransactionAccounts {
  accountsList {
    ...Account
  }
}

query PaymentListOptions {
  people(orderBy: [LAST_NAME_ASC, FIRST_NAME_ASC, ID_ASC]) {
    nodes {
      id
      name
    }
  }
}

query PaymentList($first: Int!, $offset: Int!, $condition: PaymentCondition!) {
  payments(
    first: $first
    offset: $offset
    orderBy: [CREATED_AT_DESC, ID_DESC]
    condition: $condition
  ) {
    totalCount
    nodes {
      ...Payment
      paymentDebtorsList(orderBy: PRIMARY_KEY_ASC) {
        id
        person {
          id
          name
        }
        price {
          amount
          currency
        }
      }
    }
  }
}

query Transactions(
  $first: Int!
  $offset: Int!
  $condition: TransactionCondition!
  $accountIds: [BigInt!]
) {
  transactions(
    first: $first
    offset: $offset
    orderBy: [EFFECTIVE_DATE_DESC, ID_DESC]
    condition: $condition
  ) {
    totalCount
    nodes {
      id
      description
      effectiveDate
      source
      payment {
        ...Payment
      }
      postingsList(condition: { accountIds: $accountIds }) {
        id
        amount
        account {
          ...Account
        }
      }
    }
  }
}
