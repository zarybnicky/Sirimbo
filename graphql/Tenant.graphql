fragment TenantFull on Tenant {
  id
  name
  cstsId
  bankAccount
  origins
  czIco
  czDic
  description
  address {
    street
    conscriptionNumber
    orientationNumber
    district
    city
    region
    postalCode
  }
  tenantSetting {
    tenantId
    settings
  }
  memberships: tenantMemberships(condition: { status: ACTIVE }) {
    totalCount
  }
  trainers: tenantTrainers(condition: { status: ACTIVE }) {
    totalCount
  }
  administrators: tenantAdministrators(condition: { status: ACTIVE }) {
    totalCount
  }
}

query TenantsFull {
  tenantsList(orderBy: [NAME_ASC]) {
    ...TenantFull
  }
}

query Club($showInLists: Boolean) {
  tenant: getCurrentTenant {
    id
    description
    tenantAdministratorsList(condition: { status: ACTIVE }, orderBy: SINCE_ASC) {
      ...TenantAdministrator
    }
    tenantTrainersList(condition: { status: ACTIVE }, orderBy: SINCE_ASC) {
      ...TenantTrainer
    }
    locationsList(condition: { showInLists: $showInLists }, orderBy: [SHOW_IN_LISTS_DESC, ORDERING_ASC, NAME_ASC, PRIMARY_KEY_ASC]) {
      ...LocationSummary
    }
  }
}

query TenantForm {
  tenant: getCurrentTenant {
    id
    name
    cstsId
    bankAccount
    description
  }
  clubs: federationClubs(first: 300, condition: { federation: "csts" }, orderBy: NAME_ASC) {
    nodes {
      id
      externalId
      name
    }
  }
}

mutation UpdateTenant($input: UpdateTenantInput!) {
  updateTenant(input: $input) {
    tenant {
      ...TenantFull
    }
  }
}

query TenantSettings($tenantId: BigInt!) {
  tenantSetting(tenantId: $tenantId) {
    tenantId
    settings
  }
}

mutation UpdateTenantSettings($input: UpdateTenantSettingsKeyInput!) {
  updateTenantSettingsKey(input: $input) {
    result {
      tenantId
      settings
    }
  }
}

mutation ReplaceTenantSettings($tenantId: BigInt!, $settings: JSON!) {
  updateTenantSetting(input: { tenantId: $tenantId, patch: { settings: $settings } }) {
    tenantSetting {
      tenantId
      settings
    }
  }
}
