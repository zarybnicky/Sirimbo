fragment LocationSummary on TenantLocation {
  id
  name
  coverImage {
    id
    url
  }
  address {
    city
    conscriptionNumber
    district
    orientationNumber
    postalCode
    region
    street
  }
}

fragment TenantFull on Tenant {
  id
  name
  bankAccount
  origins
  czIco
  czDic
  description
  address {
    street
    conscriptionNumber
    orientationNumber
    district
    city
    region
    postalCode
  }
  tenantSetting {
    tenantId
    settings
  }
  memberships: tenantMemberships(condition: { status: ACTIVE }) {
    totalCount
  }
  trainers: tenantTrainers(condition: { status: ACTIVE }) {
    totalCount
  }
  administrators: tenantAdministrators(condition: { status: ACTIVE }) {
    totalCount
  }
}

query TenantsFull {
  tenantsList(orderBy: [NAME_ASC]) {
    ...TenantFull
  }
}

mutation ReplaceTenantSettings($tenantId: BigInt!, $settings: JSON!) {
  updateTenantSetting(input: { tenantId: $tenantId, patch: { settings: $settings } }) {
    tenantSetting {
      tenantId
      settings
    }
  }
}

query Club($showInLists: Boolean) {
  tenant: getCurrentTenant {
    id
    description
    tenantAdministratorsList(condition: { status: ACTIVE }, orderBy: SINCE_ASC) {
      ...TenantAdministrator
    }
    tenantTrainersList(condition: { status: ACTIVE }, orderBy: SINCE_ASC) {
      ...TenantTrainer
    }
    locationsList: tenantLocationsList(condition: { showInLists: $showInLists }) {
      ...LocationSummary
    }
  }
}

query TenantForm {
  tenant: getCurrentTenant {
    id
    name
    bankAccount
    description
  }
}

query TrainerOptions {
  tenant: getCurrentTenant {
    id
    tenantTrainersList(condition: { status: ACTIVE }, orderBy: SINCE_ASC) {
      id
      person {
        id
        name
        firstName
        lastName
      }
    }
  }
}

mutation UpdateTenant($input: UpdateTenantInput!) {
  updateTenant(input: $input) {
    tenant {
      ...TenantFull
    }
  }
}
