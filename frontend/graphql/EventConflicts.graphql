fragment EventConflict on EventConflict {
  overlapRange {
    start {
      value
    }
    end {
      value
    }
  }
  person {
    id
    name
  }
  first: firstEvent {
    ...EventWithTrainer
  }
  second: secondEvent {
    ...EventWithTrainer
  }
}

query EventFormOverlaps($personIds: [BigInt!], $range: EventRangeCondition!) {
  eventsList(condition: {participant: {personIds: $personIds}, overlaps: $range, isCancelled: false}, orderBy: SINCE_ASC) {
    id
    parentId
    name
    type
    since
    until
    eventTrainersList {
      id
      personId
      person { id name }
    }
    registrations(condition: {parentRegistrationId: null, registrationStatus: ACTIVE}, first: 3) {
      nodes {
        id
        person { id name }
        couple { id shortName }
      }
    }
    registrationsList(condition: {participant: {personIds: $personIds}, registrationStatus: ACTIVE}) {
      id
      personId
      person { id name }
    }
  }
}
